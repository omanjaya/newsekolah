paths:
  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      x-permission: view_users
      summary: List users with search and filters (cursor pagination)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/UserStatus" } }
        - { name: profile_kind, in: query, schema: { $ref: "#/components/schemas/ProfileKind" } }
        - { name: role, in: query, description: Role slug, schema: { type: string } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Users page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  next_cursor: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      x-permission: create_users
      summary: Create a user with profile and roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [users]
      operationId: getUser
      x-permission: view_users
      summary: User detail
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [users]
      operationId: updateUser
      x-permission: edit_users
      summary: Update a user (username and password are not editable here)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{userId}/archive:
    post:
      tags: [users]
      operationId: archiveUser
      x-permission: delete_users
      summary: Archive (soft delete) a user; cannot archive yourself
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archived }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{userId}/restore:
    post:
      tags: [users]
      operationId: restoreUser
      x-permission: delete_users
      summary: Restore an archived user
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Restored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{userId}/reset-password:
    post:
      tags: [users]
      operationId: adminResetPassword
      x-permission: edit_users
      summary: Issue a one-time set-password token for the user (never returns a password)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [set_password_token]
                properties:
                  set_password_token: { type: string }
                  expires_in_seconds: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{userId}/impersonate:
    post:
      tags: [users]
      operationId: impersonateUser
      x-permission: impersonate_users
      summary: Start a 30-minute impersonation session as this user
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { $ref: "#/components/schemas/ClientKind" }
      responses:
        "200":
          description: Impersonation tokens
          headers:
            Set-Cookie:
              description: "`refresh_token` cookie for web clients"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/impersonation/stop:
    post:
      tags: [auth]
      operationId: stopImpersonation
      x-permission: authenticated
      summary: End the current impersonation session immediately
      responses:
        "204": { description: Stopped }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      x-public: true
      security: []
      summary: Request a password reset link (always 202)
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username_or_email]
              properties:
                username_or_email: { type: string, minLength: 1, maxLength: 150 }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      x-public: true
      security: []
      summary: Set a new password with a reset or set-password token
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/me/profile:
    put:
      tags: [me]
      operationId: updateMyProfile
      x-permission: authenticated
      summary: Update own name, email, phone and locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30 }
                locale: { type: string, enum: [id, en] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/avatar/upload-url:
    post:
      tags: [me]
      operationId: requestAvatarUpload
      x-permission: authenticated
      summary: Get a presigned upload URL for a new avatar
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, object_key, expires_at]
                properties:
                  upload_url: { type: string, format: uri }
                  object_key: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Object storage not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/avatar/confirm:
    post:
      tags: [me]
      operationId: confirmAvatarUpload
      x-permission: authenticated
      summary: Confirm the uploaded object as the new avatar (validated server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_key]
              properties:
                object_key: { type: string }
      responses:
        "200":
          description: Avatar set
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties:
                  avatar_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/permissions:
    get:
      tags: [roles]
      operationId: listPermissions
      x-permission: view_roles
      summary: Permission catalog grouped by area
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [name, permissions]
                      properties:
                        name: { type: string }
                        permissions:
                          type: array
                          items:
                            type: object
                            required: [code, description]
                            properties:
                              code: { type: string }
                              description: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      x-permission: view_roles
      summary: Roles of the tenant with permissions and user counts
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminRole" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [roles]
      operationId: createRole
      x-permission: manage_permissions
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/roles/{roleId}:
    parameters:
      - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [roles]
      operationId: updateRole
      x-permission: manage_permissions
      summary: Rename a custom role (system roles are immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [roles]
      operationId: deleteRole
      x-permission: manage_permissions
      summary: Delete an unused custom role
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/roles/{roleId}/permissions:
    put:
      tags: [roles]
      operationId: replaceRolePermissions
      x-permission: manage_permissions
      summary: Replace the permission set of a role (super_admin always keeps all)
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionCodes" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/duties:
    get:
      tags: [duties]
      operationId: listDutyTypes
      x-permission: view_roles
      summary: Duty types with their granted permissions
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Duty types
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DutyType" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [duties]
      operationId: createDutyType
      x-permission: manage_permissions
      summary: Create a duty type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DutyTypeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DutyType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/duties/{dutyId}:
    parameters:
      - { name: dutyId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [duties]
      operationId: updateDutyType
      x-permission: manage_permissions
      summary: Update a duty type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope_kind, is_active]
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                scope_kind: { $ref: "#/components/schemas/DutyScopeKind" }
                is_active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DutyType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [duties]
      operationId: deleteDutyType
      x-permission: manage_permissions
      summary: Delete an unused duty type
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/duties/{dutyId}/permissions:
    put:
      tags: [duties]
      operationId: replaceDutyPermissions
      x-permission: manage_permissions
      summary: Replace the permissions a duty grants while active
      parameters:
        - { name: dutyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionCodes" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DutyType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/duty-assignments:
    get:
      tags: [duties]
      operationId: listDutyAssignments
      x-permission: view_users
      summary: Duty assignments in an academic year
      parameters:
        - { name: academic_year_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: duty_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DutyAssignment" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [duties]
      operationId: createDutyAssignment
      x-permission: manage_master_data
      summary: Assign a duty to a user for an academic year (optionally scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DutyAssignmentWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DutyAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/duty-assignments/{assignmentId}:
    parameters:
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [duties]
      operationId: updateDutyAssignment
      x-permission: manage_master_data
      summary: Activate, deactivate or end a duty assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
                ends_on: { type: string, format: date }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DutyAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [duties]
      operationId: deleteDutyAssignment
      x-permission: manage_master_data
      summary: Remove a duty assignment
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      x-permission: view_audit_logs
      summary: Audit log, newest first (cursor pagination)
      parameters:
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string, maxLength: 80 } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Audit page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditLogEntry" } }
                  next_cursor: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/directory/users:
    get:
      tags: [users]
      operationId: listDirectoryUsers
      x-permission: authenticated
      summary: Names of active users for pickers (schedules, substitutes, audiences); no contact details
      parameters:
        - name: profile_kind
          in: query
          schema: { $ref: "#/components/schemas/ProfileKind" }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DirectoryUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/mfa:
    get:
      tags: [users]
      operationId: getMfaStatus
      x-permission: authenticated
      summary: Whether two-factor is enrolled for the current user
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/mfa/enroll:
    post:
      tags: [users]
      operationId: startMfaEnrolment
      x-permission: authenticated
      summary: Start TOTP enrolment; returns the secret, otpauth URL and recovery codes once
      responses:
        "201":
          description: Enrolment started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrolment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/me/mfa/confirm:
    post:
      tags: [users]
      operationId: confirmMfaEnrolment
      x-permission: authenticated
      summary: Activate two-factor by proving a current code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "204": { description: Confirmed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/mfa/disable:
    post:
      tags: [users]
      operationId: disableMfa
      x-permission: authenticated
      summary: Turn two-factor off (requires a current code or a recovery code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/mfa/recovery-codes:
    post:
      tags: [users]
      operationId: regenerateMfaRecoveryCodes
      x-permission: authenticated
      summary: Replace the recovery codes (shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: New codes
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  schemas:
    MfaStatus:
      type: object
      required: [enrolled, confirmed, remaining_recovery_codes]
      properties:
        enrolled: { type: boolean }
        confirmed: { type: boolean }
        remaining_recovery_codes: { type: integer }
    MfaEnrolment:
      type: object
      required: [secret, otpauth_url, recovery_codes]
      properties:
        secret: { type: string }
        otpauth_url: { type: string }
        recovery_codes: { type: array, items: { type: string } }
    MfaCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 32 }
    DirectoryUser:
      type: object
      required: [id, name, username]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        profile_kind: { $ref: "#/components/schemas/ProfileKind" }
    UserStatus:
      type: string
      enum: [active, inactive, invited]
    ProfileKind:
      type: string
      enum: [student, teacher, staff, parent]
    DutyScopeKind:
      type: string
      enum: [school, class, student]

    UserProfileFields:
      type: object
      description: Optional profile columns; which ones apply depends on profile_kind.
      properties:
        nik: { type: string, maxLength: 16 }
        gender: { type: string, enum: [L, P, ""] }
        birth_place: { type: string, maxLength: 100 }
        birth_date: { type: string, format: date }
        religion: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 500 }
        district: { type: string, maxLength: 80 }
        city: { type: string, maxLength: 80 }
        blood_type: { type: string, maxLength: 3 }
        nis: { type: string, maxLength: 30 }
        nisn: { type: string, maxLength: 30 }
        entry_year: { type: integer }
        previous_school: { type: string, maxLength: 150 }
        father_name: { type: string, maxLength: 150 }
        mother_name: { type: string, maxLength: 150 }
        guardian_name: { type: string, maxLength: 150 }
        guardian_phone: { type: string, maxLength: 30 }
        parent_occupation: { type: string, maxLength: 100 }
        nip: { type: string, maxLength: 40 }
        nuptk: { type: string, maxLength: 40 }
        employment_status: { type: string, maxLength: 30 }
        last_education: { type: string, maxLength: 100 }
        joined_year: { type: integer }
        specialization: { type: string, maxLength: 150 }
        employee_number: { type: string, maxLength: 40 }
        position: { type: string, maxLength: 100 }

    RoleGrant:
      type: object
      required: [role_id]
      properties:
        role_id: { type: string, format: uuid }
        is_primary: { type: boolean, default: false }

    UserWriteFields:
      type: object
      required: [name, profile_kind, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        locale: { type: string, enum: [id, en] }
        profile_kind: { $ref: "#/components/schemas/ProfileKind" }
        profile: { $ref: "#/components/schemas/UserProfileFields" }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RoleGrant" }

    CreateUserRequest:
      allOf:
        - $ref: "#/components/schemas/UserWriteFields"
        - type: object
          properties:
            username:
              type: string
              maxLength: 80
              description: Generated from the name when omitted.
            password:
              type: string
              minLength: 8
              maxLength: 128
              description: When omitted a random initial password is set and the user must change it via a set-password token.

    UpdateUserRequest:
      $ref: "#/components/schemas/UserWriteFields"

    AdminUser:
      type: object
      required: [id, username, name, status, profile_kind, roles, must_change_password, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        phone: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/UserStatus" }
        profile_kind: { $ref: "#/components/schemas/ProfileKind" }
        locale: { type: string }
        avatar_url: { type: string, format: uri }
        must_change_password: { type: boolean }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        profile: { $ref: "#/components/schemas/UserProfileFields" }

    PermissionCodes:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string }

    RoleWrite:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9_]{2,50}$" }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 500 }

    AdminRole:
      type: object
      required: [id, slug, name, is_system, permissions]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        user_count: { type: integer }

    DutyTypeWrite:
      type: object
      required: [slug, name, scope_kind]
      properties:
        slug: { type: string, pattern: "^[a-z0-9_]{2,50}$" }
        name: { type: string, minLength: 1, maxLength: 150 }
        scope_kind: { $ref: "#/components/schemas/DutyScopeKind" }

    DutyType:
      type: object
      required: [id, slug, name, scope_kind, is_active, permissions]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        scope_kind: { $ref: "#/components/schemas/DutyScopeKind" }
        is_active: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    DutyAssignmentWrite:
      type: object
      required: [academic_year_id, duty_type_id, user_id]
      properties:
        academic_year_id: { type: string, format: uuid }
        duty_type_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        scope_class_id: { type: string, format: uuid }
        scope_student_id: { type: string, format: uuid }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }

    DutyAssignment:
      type: object
      required: [id, academic_year_id, duty_type_id, duty_slug, duty_name, user_id, is_active, starts_on]
      properties:
        id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        duty_type_id: { type: string, format: uuid }
        duty_slug: { type: string }
        duty_name: { type: string }
        user_id: { type: string, format: uuid }
        scope_class_id: { type: string, format: uuid }
        scope_student_id: { type: string, format: uuid }
        is_active: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }

    AuditLogEntry:
      type: object
      required: [id, action, entity_type, occurred_at]
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        acting_as_user_id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        ip: { type: string }
        user_agent: { type: string }
        request_id: { type: string }
        occurred_at: { type: string, format: date-time }
