paths:
  /v1/platform/tenants:
    get:
      tags: [platform]
      operationId: listPlatformTenants
      x-permission: platform_superadmin
      summary: List every tenant with a health summary
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { type: array, items: { $ref: "#/components/schemas/PlatformTenantHealth" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      tags: [platform]
      operationId: createPlatformTenant
      x-permission: platform_superadmin
      summary: Provision a new tenant and its first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformTenantCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenantCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}:
    get:
      tags: [platform]
      operationId: getPlatformTenant
      x-permission: platform_superadmin
      summary: One tenant's health summary and module flags
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenantDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/suspend:
    post:
      tags: [platform]
      operationId: suspendPlatformTenant
      x-permission: platform_superadmin
      summary: Suspend a tenant (blocks sign-in without deleting anything)
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/resume:
    post:
      tags: [platform]
      operationId: resumePlatformTenant
      x-permission: platform_superadmin
      summary: Reverse a suspension
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/domain:
    put:
      tags: [platform]
      operationId: updatePlatformTenantDomain
      x-permission: platform_superadmin
      summary: Set a tenant's custom domain
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, minLength: 1, maxLength: 253 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/flags:
    get:
      tags: [platform]
      operationId: listPlatformTenantFlags
      x-permission: platform_superadmin
      summary: Module feature flags for a tenant
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlatformModuleFlag" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/flags/{module}:
    put:
      tags: [platform]
      operationId: setPlatformTenantFlag
      x-permission: platform_superadmin
      summary: Enable or disable one module for a tenant
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: module,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PlatformModule" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformModuleFlag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/exports:
    post:
      tags: [platform]
      operationId: requestPlatformTenantExport
      x-permission: platform_superadmin
      summary: Enqueue a ZIP export of the tenant's core tables
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Export enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/tenants/{tenantId}/exports/{exportId}:
    get:
      tags: [platform]
      operationId: getPlatformTenantExport
      x-permission: platform_superadmin
      summary: Export status, with a download URL once it is done
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/platform/operator-alerts:
    get:
      tags: [platform]
      operationId: getPlatformOperatorAlertSettings
      x-permission: platform_superadmin
      summary: Platform-wide operator alerting settings (Telegram), never the bot token
      responses:
        "200":
          description: Operator alert settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOperatorAlertSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [platform]
      operationId: updatePlatformOperatorAlertSettings
      x-permission: platform_superadmin
      summary: Partially update operator alerting settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformOperatorAlertSettingsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOperatorAlertSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/operator-alerts/detect-chat:
    post:
      tags: [platform]
      operationId: detectPlatformOperatorAlertChat
      x-permission: platform_superadmin
      summary: List candidate Telegram chats from the bot's recent updates
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                telegram_token:
                  type: string
                  description: >-
                    Test a token that has not been saved yet. Omitted:
                    uses the currently stored token.
      responses:
        "200":
          description: Candidate chats
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/PlatformOperatorAlertChatCandidate" },
                    }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/operator-alerts/test:
    post:
      tags: [platform]
      operationId: testPlatformOperatorAlert
      x-permission: platform_superadmin
      summary: Send a test message to the configured Telegram chat
      responses:
        "200":
          description: >-
            Result of the attempt. Always 200: success=false with an error
            description is not a request failure, it is Telegram's answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOperatorAlertTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    PlatformEducationLevel:
      type: string
      enum: [sd, smp, sma, smk]
    PlatformTenantStatus:
      type: string
      enum: [trial, active, suspended, offboarding]
    PlatformModule:
      type: string
      enum: [library, discipline, grading, permits, announcements, reports, billing]
    PlatformTenant:
      type: object
      required: [id, slug, name, education_level, timezone, status, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        education_level: { $ref: "#/components/schemas/PlatformEducationLevel" }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/PlatformTenantStatus" }
        primary_domain: { type: string }
        created_at: { type: string, format: date-time }
    PlatformTenantHealth:
      allOf:
        - $ref: "#/components/schemas/PlatformTenant"
        - type: object
          required: [user_count, storage_bucket]
          properties:
            user_count: { type: integer }
            active_academic_year: { type: string }
            last_activity_at: { type: string, format: date-time }
            storage_bucket: { type: string }
    PlatformModuleFlag:
      type: object
      required: [module, enabled]
      properties:
        module: { $ref: "#/components/schemas/PlatformModule" }
        enabled: { type: boolean }
    PlatformTenantDetail:
      allOf:
        - $ref: "#/components/schemas/PlatformTenantHealth"
        - type: object
          required: [flags]
          properties:
            flags: { type: array, items: { $ref: "#/components/schemas/PlatformModuleFlag" } }
    PlatformTenantCreate:
      type: object
      required: [slug, name, education_level, timezone, admin_username, admin_name]
      properties:
        slug: { type: string, minLength: 2, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 150 }
        education_level: { $ref: "#/components/schemas/PlatformEducationLevel" }
        timezone: { type: string, minLength: 1 }
        admin_username: { type: string, minLength: 3, maxLength: 80 }
        admin_email: { type: string, format: email }
        admin_name: { type: string, minLength: 1, maxLength: 150 }
    PlatformTenantCreated:
      type: object
      required: [tenant, admin_username, admin_password]
      properties:
        tenant: { $ref: "#/components/schemas/PlatformTenant" }
        admin_username: { type: string }
        admin_password:
          type: string
          description: Shown exactly once; the server never stores or returns it again.
    PlatformExportStatus:
      type: string
      enum: [pending, running, done, failed]
    PlatformExport:
      type: object
      required: [id, tenant_id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/PlatformExportStatus" }
        download_url: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    PlatformOperatorAlertSettings:
      type: object
      required:
        [
          enabled,
          telegram_chat_id,
          telegram_token_set,
          check_health,
          check_containers,
          check_disk,
          check_memory,
          check_backup,
          check_certificate,
          check_errors_5xx,
          disk_threshold_percent,
          memory_threshold_mb,
          backup_max_age_hours,
          cert_expiry_days,
          daily_summary_enabled,
          daily_summary_hour,
          updated_at,
        ]
      properties:
        enabled: { type: boolean }
        telegram_chat_id: { type: string }
        telegram_token_set: { type: boolean }
        telegram_token_hint:
          type: string
          description: Masked hint of the stored token (e.g. "****1234"); absent when no token is stored.
        check_health: { type: boolean }
        check_containers: { type: boolean }
        check_disk: { type: boolean }
        check_memory: { type: boolean }
        check_backup: { type: boolean }
        check_certificate: { type: boolean }
        check_errors_5xx: { type: boolean }
        disk_threshold_percent: { type: integer, minimum: 1, maximum: 100 }
        memory_threshold_mb: { type: integer, minimum: 1 }
        backup_max_age_hours: { type: integer, minimum: 1 }
        cert_expiry_days: { type: integer, minimum: 1 }
        daily_summary_enabled: { type: boolean }
        daily_summary_hour: { type: integer, minimum: 0, maximum: 23 }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
    PlatformOperatorAlertSettingsUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        telegram_token:
          type: string
          description: A new token to seal and store, replacing any existing one.
        telegram_token_clear:
          type: boolean
          description: Set true to remove the stored token. Mutually exclusive with telegram_token.
        telegram_chat_id: { type: string }
        check_health: { type: boolean }
        check_containers: { type: boolean }
        check_disk: { type: boolean }
        check_memory: { type: boolean }
        check_backup: { type: boolean }
        check_certificate: { type: boolean }
        check_errors_5xx: { type: boolean }
        disk_threshold_percent: { type: integer, minimum: 1, maximum: 100 }
        memory_threshold_mb: { type: integer, minimum: 1 }
        backup_max_age_hours: { type: integer, minimum: 1 }
        cert_expiry_days: { type: integer, minimum: 1 }
        daily_summary_enabled: { type: boolean }
        daily_summary_hour: { type: integer, minimum: 0, maximum: 23 }
    PlatformOperatorAlertChatCandidate:
      type: object
      required: [id, type, title]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        title: { type: string }
    PlatformOperatorAlertTestResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        error:
          type: string
          description: Telegram's own error description when success is false. Never the token.
