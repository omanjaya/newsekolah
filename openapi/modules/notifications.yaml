paths:
  /v1/notifications:
    get:
      tags:
        - notifications
      operationId: listNotifications
      x-permission: authenticated
      summary: The current user's own inbox, newest first
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: Case-insensitive substring match against title or body.
          schema: { type: string, maxLength: 120 }
        - name: kind
          in: query
          description: Exact notification kind (e.g. leave_request_submitted).
          schema: { type: string }
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notifications/unread-count:
    get:
      tags:
        - notifications
      operationId: getUnreadNotificationCount
      x-permission: authenticated
      summary: Unread count for the current user (badge)
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notifications/read-all:
    put:
      tags:
        - notifications
      operationId: markAllNotificationsRead
      x-permission: authenticated
      summary: Mark every unread notification for the current user as read
      responses:
        "204":
          description: Marked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notifications/{notificationId}/read:
    put:
      tags:
        - notifications
      operationId: markNotificationRead
      x-permission: authenticated
      summary: Mark one notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/notification-preferences:
    get:
      tags:
        - notifications
      operationId: listNotificationPreferences
      x-permission: authenticated
      summary: The current user's channel preferences for a set of notification kinds
      parameters:
        - name: kinds
          in: query
          required: true
          description: Comma-separated notification kinds
          schema:
            type: string
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferenceMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - notifications
      operationId: setNotificationPreference
      x-permission: authenticated
      summary: Enable or disable one channel for one notification kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceUpdate"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notification-settings:
    get:
      tags:
        - notifications
      operationId: getNotificationSettings
      x-permission: authenticated
      summary: The current user's quiet hours and daily digest settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - notifications
      operationId: updateNotificationSettings
      x-permission: authenticated
      summary: Update quiet hours and daily digest settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/push-devices:
    get:
      tags:
        - notifications
      operationId: listPushDevices
      x-permission: authenticated
      summary: The current user's registered push devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PushDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - notifications
      operationId: registerPushDevice
      x-permission: authenticated
      summary: Register (or refresh) a push device for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceRegistration"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - notifications
      operationId: unregisterPushDevice
      x-permission: authenticated
      summary: Unregister a push device by its token or endpoint
      parameters:
        - name: token_or_endpoint
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unregistered
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tenant/notification-defaults:
    get:
      tags:
        - notifications
      operationId: getTenantNotificationDefaults
      x-permission: manage_notification_settings
      summary: Tenant-wide default channels for one notification kind
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - notifications
      operationId: setTenantNotificationDefault
      x-permission: manage_notification_settings
      summary: Set the tenant-wide default for one (kind, channel) pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceUpdate"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/whatsapp/provider-config:
    get:
      tags:
        - whatsapp
      operationId: getWhatsAppProviderConfig
      x-permission: manage_whatsapp
      summary: The tenant's WhatsApp gateway configuration (never the secret itself)
      responses:
        "200":
          description: Configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppProviderStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - whatsapp
      operationId: setWhatsAppProviderConfig
      x-permission: manage_whatsapp
      summary: Configure the tenant's WhatsApp gateway (Meta Cloud API or a local gateway)
      description: |
        Leaving access_token (provider=meta) or gateway_header_value (provider=gateway) empty keeps the
        previously saved secret -- the web client never re-displays a saved token, so it cannot resubmit it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppProviderInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppProviderStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/whatsapp/templates:
    get:
      tags:
        - whatsapp
      operationId: listWhatsAppTemplates
      x-permission: manage_whatsapp
      summary: The tenant's WhatsApp message templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhatsAppTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - whatsapp
      operationId: createWhatsAppTemplate
      x-permission: manage_whatsapp
      summary: Create a WhatsApp message template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/whatsapp/templates/{templateId}:
    put:
      tags:
        - whatsapp
      operationId: updateWhatsAppTemplate
      x-permission: manage_whatsapp
      summary: Update a WhatsApp message template
      parameters:
        - $ref: "#/components/parameters/WhatsAppTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTemplateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - whatsapp
      operationId: deleteWhatsAppTemplate
      x-permission: manage_whatsapp
      summary: Delete a WhatsApp message template
      parameters:
        - $ref: "#/components/parameters/WhatsAppTemplateId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/whatsapp/templates/{templateId}/preview:
    post:
      tags:
        - whatsapp
      operationId: previewWhatsAppTemplate
      x-permission: manage_whatsapp
      summary: Render a template against sample variables, without sending anything
      parameters:
        - $ref: "#/components/parameters/WhatsAppTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTemplatePreviewInput"
      responses:
        "200":
          description: Rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTemplatePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/whatsapp/deliveries:
    get:
      tags:
        - whatsapp
      operationId: listWhatsAppDeliveries
      x-permission: manage_whatsapp
      summary: The WhatsApp delivery log, newest first
      parameters:
        - name: status
          in: query
          description: Filter to one delivery status; omitted or empty returns every status.
          schema:
            $ref: "#/components/schemas/WhatsAppDeliveryStatus"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDeliveryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/whatsapp/deliveries/{deliveryId}/resend:
    post:
      tags:
        - whatsapp
      operationId: resendWhatsAppDelivery
      x-permission: manage_whatsapp
      summary: Re-send a WhatsApp message, recording a new delivery log entry
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New delivery queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/whatsapp/webhook:
    get:
      tags:
        - whatsapp
      operationId: verifyWhatsAppWebhook
      x-public: true
      security: []
      summary: Meta's webhook verification handshake (hub.challenge echo)
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge echoed back
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - whatsapp
      operationId: receiveWhatsAppWebhook
      x-public: true
      security: []
      summary: Inbound WhatsApp delivery status updates (delivered, read)
      description: |
        Meta sends this as application/json, but the body is declared here as application/octet-stream (raw
        bytes) on purpose: the signature must be verified over the exact bytes received, before any JSON
        decoding, and the generated server only hands over a raw io.Reader for a non-JSON content type.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Processed
        "401":
          description: Invalid signature
components:
  parameters:
    WhatsAppTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    NotificationChannel:
      type: string
      enum:
        - inapp
        - push
        - whatsapp
        - email
    Notification:
      type: object
      required:
        - id
        - kind
        - title
        - body
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        href:
          type: string
        data:
          type: object
          additionalProperties: true
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: object
          required:
            - next_cursor
          properties:
            next_cursor:
              type: string
    NotificationPreferenceMap:
      type: object
      description: Map of "kind" to a map of channel -> enabled.
      additionalProperties:
        $ref: "#/components/schemas/NotificationChannelMap"
    NotificationChannelMap:
      type: object
      additionalProperties:
        type: boolean
    NotificationPreferenceUpdate:
      type: object
      required:
        - kind
        - channel
        - enabled
      properties:
        kind:
          type: string
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        enabled:
          type: boolean
    NotificationSettings:
      type: object
      required:
        - digest_enabled
        - digest_hour
      properties:
        quiet_hours_start:
          type: integer
          minimum: 0
          maximum: 23
        quiet_hours_end:
          type: integer
          minimum: 0
          maximum: 23
        digest_enabled:
          type: boolean
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
    NotificationSettingsUpdate:
      type: object
      required:
        - digest_enabled
        - digest_hour
      properties:
        quiet_hours_start:
          type: integer
          minimum: 0
          maximum: 23
        quiet_hours_end:
          type: integer
          minimum: 0
          maximum: 23
        digest_enabled:
          type: boolean
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
    PushPlatform:
      type: string
      description: "One of: web, ios, android (validated server-side, not as an OpenAPI enum, to avoid colliding with ClientKind's identical value set in codegen)."
      maxLength: 20
    PushDeviceRegistration:
      type: object
      required:
        - platform
        - token_or_endpoint
      properties:
        platform:
          $ref: "#/components/schemas/PushPlatform"
        token_or_endpoint:
          type: string
          description: iOS/Android device token, or the web push subscription endpoint URL.
        p256dh:
          type: string
          description: Required for platform=web.
        auth_key:
          type: string
          description: Required for platform=web.
        device_name:
          type: string
    PushDevice:
      type: object
      required:
        - id
        - platform
        - device_name
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/PushPlatform"
        device_name:
          type: string
    WhatsAppProviderKind:
      type: string
      enum:
        - meta
        - gateway
    WhatsAppProviderInput:
      type: object
      required:
        - provider
      properties:
        provider:
          $ref: "#/components/schemas/WhatsAppProviderKind"
        phone_number_id:
          type: string
          description: Meta Cloud API phone number id (provider=meta).
        access_token:
          type: string
          description: Meta Cloud API access token (provider=meta). Empty keeps the previously saved token.
        gateway_url:
          type: string
          description: URL the local gateway exposes for sending (provider=gateway).
        gateway_header_name:
          type: string
          description: Auth header name the gateway expects (provider=gateway).
        gateway_header_value:
          type: string
          description: Auth header value (provider=gateway). Empty keeps the previously saved value.
        is_active:
          type: boolean
    WhatsAppProviderStatus:
      type: object
      required:
        - provider
        - has_access_token
        - has_gateway_header
        - is_active
      properties:
        provider:
          $ref: "#/components/schemas/WhatsAppProviderKind"
        phone_number_id:
          type: string
        has_access_token:
          type: boolean
          description: Whether an access token is stored, without revealing it.
        gateway_url:
          type: string
        gateway_header_name:
          type: string
        has_gateway_header:
          type: boolean
          description: Whether a gateway header value is stored, without revealing it.
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
    WhatsAppTemplateInput:
      type: object
      required:
        - name
        - locale
        - meta_template_name
        - body
      properties:
        name:
          type: string
        locale:
          type: string
          description: BCP-47 locale code, e.g. "id" or "en".
        meta_template_name:
          type: string
          description: The template name already approved in the tenant's WhatsApp Business Manager.
        body:
          type: string
          description: Template body with {{placeholder}} variables.
    WhatsAppTemplate:
      type: object
      required:
        - id
        - name
        - locale
        - meta_template_name
        - body
        - placeholders
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        locale:
          type: string
        meta_template_name:
          type: string
        body:
          type: string
        placeholders:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WhatsAppTemplatePreviewInput:
      type: object
      properties:
        variables:
          type: object
          additionalProperties:
            type: string
    WhatsAppTemplatePreview:
      type: object
      required:
        - rendered
      properties:
        rendered:
          type: string
        missing_variables:
          type: array
          items:
            type: string
    WhatsAppDeliveryStatus:
      type: string
      enum:
        - pending
        - sent
        - failed
        - delivered
        - read
    WhatsAppDelivery:
      type: object
      required:
        - id
        - target
        - provider
        - status
        - attempts
        - created_at
      properties:
        id:
          type: string
          format: uuid
        target:
          type: string
          description: Recipient phone number.
        provider:
          type: string
        template_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WhatsAppDeliveryStatus"
        provider_message_id:
          type: string
        error:
          type: string
        attempts:
          type: integer
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    WhatsAppDeliveryPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppDelivery"
        page:
          type: object
          required:
            - next_cursor
          properties:
            next_cursor:
              type: string
