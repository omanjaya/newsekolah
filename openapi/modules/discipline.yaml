paths:
  /v1/discipline/violation-types:
    get:
      tags: [discipline]
      operationId: listViolationTypes
      x-permission: view_discipline
      summary: Violation catalog with point values
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
        - { name: search, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ViolationType" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [discipline]
      operationId: createViolationType
      x-permission: manage_discipline_catalog
      summary: Add a violation type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationTypeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViolationType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/discipline/violation-types/{typeId}:
    put:
      tags: [discipline]
      operationId: updateViolationType
      x-permission: manage_discipline_catalog
      summary: Edit a violation type
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationTypeWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViolationType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [discipline]
      operationId: deleteViolationType
      x-permission: manage_discipline_catalog
      summary: Retire a violation type (existing records keep their snapshot)
      parameters:
        - { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/policy:
    get:
      tags: [discipline]
      operationId: getDisciplinePolicy
      x-permission: view_discipline
      summary: Warning-letter ladder (levels and point thresholds)
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SPPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [discipline]
      operationId: updateDisciplinePolicy
      x-permission: manage_settings
      summary: Replace the warning-letter ladder (new policy version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [levels]
              properties:
                levels:
                  { type: array, minItems: 1, items: { $ref: "#/components/schemas/SPLevel" } }
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SPPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/warning-letter-template:
    get:
      tags: [discipline]
      operationId: getWarningLetterTemplatePolicy
      x-permission: view_discipline
      summary: Warning-letter numbering pattern and opening/closing wording
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarningLetterTemplatePolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [discipline]
      operationId: updateWarningLetterTemplatePolicy
      x-permission: manage_settings
      summary: Replace the warning-letter numbering pattern and wording
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarningLetterTemplatePolicy" }
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarningLetterTemplatePolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/violations:
    get:
      tags: [discipline]
      operationId: listViolations
      x-permission: view_discipline
      summary: Violation records this year, filterable by class and date
      parameters:
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: include_voided, in: query, schema: { type: boolean, default: false } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ViolationRecord" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [discipline]
      operationId: recordViolation
      x-permission: record_violations
      summary: Record one or more violations for a student in one call (points snapshotted from the catalog)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_user_id, occurred_on]
              properties:
                student_user_id: { type: string, format: uuid }
                violation_type_id:
                  {
                    type: string,
                    format: uuid,
                    description: "Single-type form; use violation_type_ids for a batch of 1-50.",
                  }
                violation_type_ids:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 50,
                    uniqueItems: true,
                    items: { type: string, format: uuid },
                  }
                occurred_on: { type: string, format: date }
                notes: { type: string, maxLength: 1000 }
                attendance_session_id: { type: string, format: uuid }
                workflow_instance_id: { type: string, format: uuid }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViolationRecordResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/discipline/violations/{recordId}/void:
    post:
      tags: [discipline]
      operationId: voidViolation
      x-permission: record_violations
      summary: Void a record with a reason (kept for audit, no longer counts)
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViolationRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/discipline/points-preview:
    post:
      tags: [discipline]
      operationId: previewViolationPoints
      x-permission: record_violations
      summary: Current point total and issued SP levels for one or more students, before recording
      description: |
        One query for every requested student: each student's current active point total this year and
        the warning-letter levels already issued to them, plus the tenant's current SP policy. The
        client already has each violation type's points from the catalog it fetched to build the
        checklist, so it adds those itself to get the new total and, with the policy's levels and
        issued_levels, works out which level (if any) is newly due -- mirroring how a live gradebook
        average is computed client-side from server-fetched scores. Nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_user_ids]
              properties:
                student_user_ids:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 50,
                    uniqueItems: true,
                    items: { type: string, format: uuid },
                  }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                required: [data, policy]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PointsPreviewEntry" } }
                  policy: { $ref: "#/components/schemas/SPPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/violations/{recordId}/attachments:
    get:
      tags: [discipline]
      operationId: listViolationAttachments
      x-permission: view_discipline
      summary: Photo evidence on a violation record
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ViolationAttachment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/violations/{recordId}/attachments/upload-url:
    post:
      tags: [discipline]
      operationId: requestViolationAttachmentUpload
      x-permission: record_violations
      summary: Presigned upload target for a new photo (1-3 per record)
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Target
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, object_key, expires_at]
                properties:
                  upload_url: { type: string }
                  object_key: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/discipline/violations/{recordId}/attachments/confirm:
    post:
      tags: [discipline]
      operationId: confirmViolationAttachment
      x-permission: record_violations
      summary: Validate and record an uploaded photo (JPEG/PNG, max 3 per record)
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_key]
              properties:
                object_key: { type: string }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViolationAttachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/discipline/violations/{recordId}/attachments/{attachmentId}/url:
    get:
      tags: [discipline]
      operationId: getViolationAttachmentUrl
      x-permission: view_discipline
      summary: Short-lived download URL for one photo
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/discipline/students/{studentId}:
    get:
      tags: [discipline]
      operationId: getStudentDiscipline
      x-permission: view_discipline
      summary: One student's points, records, letters and levels now due
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDiscipline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discipline/students/{studentId}/report:
    get:
      tags: [discipline]
      operationId: getStudentDisciplineReport
      x-permission: view_discipline
      summary: Individual student PDF report (violations, reporter names, signature block)
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/me/discipline:
    get:
      tags: [discipline]
      operationId: getMyDiscipline
      x-permission: authenticated
      summary: The current student's own points, records and warning letters
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDiscipline" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/discipline/point-totals:
    get:
      tags: [discipline]
      operationId: listPointTotals
      x-permission: view_discipline
      summary: Students ranked by active points this year
      parameters:
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PointTotal" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/sp-candidates:
    get:
      tags: [discipline]
      operationId: listSPCandidates
      x-permission: issue_warning_letters
      summary: Students eligible for a warning letter (the counselor's issuing screen)
      parameters:
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: level,
            in: query,
            schema: { type: integer, minimum: 1 },
            description: "Narrow to students whose total falls in this level's range.",
          }
        - {
            name: search,
            in: query,
            schema: { type: string, maxLength: 160 },
            description: "Name, NIS or class.",
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SPCandidate" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/warning-letters:
    get:
      tags: [discipline]
      operationId: listWarningLetters
      x-permission: view_discipline
      summary: Issued warning letters this year
      parameters:
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Letters
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WarningLetter" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [discipline]
      operationId: issueWarningLetter
      x-permission: issue_warning_letters
      summary: Issue the next due warning-letter level for a student (numbered PDF)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_user_id, level]
              properties:
                student_user_id: { type: string, format: uuid }
                level: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarningLetter" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/discipline/warning-letters/{letterId}:
    get:
      tags: [discipline]
      operationId: getWarningLetter
      x-permission: view_discipline
      summary: One warning letter
      parameters:
        - { name: letterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Letter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarningLetter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/warning-letters/{letterId}/document:
    get:
      tags: [discipline]
      operationId: getWarningLetterDocumentUrl
      x-permission: view_discipline
      summary: Short-lived download URL for the letter PDF
      parameters:
        - { name: letterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/discipline/counselings:
    get:
      tags: [discipline]
      operationId: listMyCounselings
      x-permission: manage_counseling
      summary: Counseling notes written by the current counselor
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Counseling" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [discipline]
      operationId: createCounseling
      x-permission: manage_counseling
      summary: Write an encrypted counseling note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounselingWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Counseling" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discipline/counselings/{counselingId}:
    get:
      tags: [discipline]
      operationId: getCounseling
      x-permission: manage_counseling
      summary: Open one note (visibility enforced server-side)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Counseling" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [discipline]
      operationId: updateCounseling
      x-permission: manage_counseling
      summary: Edit a note (author only)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounselingWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Counseling" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [discipline]
      operationId: deleteCounseling
      x-permission: manage_counseling
      summary: Delete a note (author only)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/students/{studentId}/counselings:
    get:
      tags: [discipline]
      operationId: listStudentCounselings
      x-permission: manage_counseling
      summary: Notes about one student the caller may read
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Counseling" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/discipline/counselings/bk-team:
    get:
      tags: [discipline]
      operationId: listBKTeamCounselings
      x-permission: manage_counseling
      summary: Notes any author shared with the whole BK team (requires duty counselor), optionally by topic
      parameters:
        - { name: topic, in: query, schema: { $ref: "#/components/schemas/CounselingTopic" } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Counseling" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discipline/counselings/{counselingId}/report:
    get:
      tags: [discipline]
      operationId: getCounselingReport
      x-permission: manage_counseling
      summary: Printable A4 report for one note (visibility enforced server-side)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/counselings/{counselingId}/attachments:
    get:
      tags: [discipline]
      operationId: listCounselingAttachments
      x-permission: manage_counseling
      summary: Attachments on a note (visibility enforced server-side)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { type: array, items: { $ref: "#/components/schemas/CounselingAttachment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/counselings/{counselingId}/attachments/upload-url:
    post:
      tags: [discipline]
      operationId: requestCounselingAttachmentUpload
      x-permission: manage_counseling
      summary: Presigned upload target for a new attachment (author only)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Target
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, object_key, expires_at]
                properties:
                  upload_url: { type: string }
                  object_key: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/counselings/{counselingId}/attachments/confirm:
    post:
      tags: [discipline]
      operationId: confirmCounselingAttachment
      x-permission: manage_counseling
      summary: Validate and record an uploaded attachment (JPEG/PNG, author only)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_key]
              properties:
                object_key: { type: string }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CounselingAttachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/discipline/counselings/{counselingId}/attachments/{attachmentId}/url:
    get:
      tags: [discipline]
      operationId: getCounselingAttachmentUrl
      x-permission: manage_counseling
      summary: Short-lived download URL for one attachment (visibility enforced server-side)
      parameters:
        - { name: counselingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  schemas:
    ViolationType:
      type: object
      required: [id, code, name, points, category, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        points: { type: integer }
        category: { type: string }
        is_active: { type: boolean }
    ViolationTypeWrite:
      type: object
      required: [code, name, points]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 160 }
        points: { type: integer, minimum: 0 }
        category: { type: string, maxLength: 60 }
        is_active: { type: boolean, default: true }
    SPLevel:
      type: object
      required: [level, min_points, label]
      properties:
        level: { type: integer, minimum: 1 }
        min_points: { type: integer, minimum: 1 }
        label: { type: string, minLength: 1, maxLength: 60 }
    SPPolicy:
      type: object
      required: [version, levels]
      properties:
        version: { type: integer }
        levels: { type: array, items: { $ref: "#/components/schemas/SPLevel" } }
    ViolationRecord:
      type: object
      required:
        [
          id,
          student_user_id,
          violation_type_id,
          type_name,
          points,
          occurred_on,
          reporter_user_id,
          notes,
          created_at,
          is_voided,
        ]
      properties:
        id: { type: string, format: uuid }
        student_user_id: { type: string, format: uuid }
        violation_type_id: { type: string, format: uuid }
        type_code: { type: string }
        type_name: { type: string }
        type_category: { type: string }
        points: { type: integer }
        occurred_on: { type: string, format: date }
        reporter_user_id: { type: string, format: uuid }
        notes: { type: string }
        attendance_session_id: { type: string, format: uuid }
        workflow_instance_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        is_voided: { type: boolean }
        voided_at: { type: string, format: date-time }
        void_reason: { type: string }
    ViolationRecordResult:
      type: object
      required: [record, total_points, due_levels]
      properties:
        record:
          {
            $ref: "#/components/schemas/ViolationRecord",
            description: "The first record from this call (single-type callers only ever get one).",
          }
        records:
          {
            type: array,
            items: { $ref: "#/components/schemas/ViolationRecord" },
            description: "Every record written this call, for batch callers.",
          }
        total_points: { type: integer }
        due_levels: { type: array, items: { $ref: "#/components/schemas/SPLevel" } }
    WarningLetterTemplatePolicy:
      type: object
      required: [number_pattern, seq_pad, opening_text, closing_text]
      properties:
        number_pattern:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: "Placeholders: {{seq}}, {{sp_level_number}}, {{month_roman}}, {{year}}.",
          }
        seq_pad: { type: integer, minimum: 0, maximum: 10 }
        opening_text: { type: string, maxLength: 1000 }
        closing_text: { type: string, maxLength: 1000 }
    SPCandidate:
      type: object
      required: [student_user_id, student_name, nis, class_name, total_points, issued_levels]
      properties:
        student_user_id: { type: string, format: uuid }
        student_name: { type: string }
        nis: { type: string }
        class_name: { type: string }
        total_points: { type: integer }
        issued_levels: { type: array, items: { type: integer } }
    PointTotal:
      type: object
      required: [student_user_id, total_points, record_count]
      properties:
        student_user_id: { type: string, format: uuid }
        total_points: { type: integer }
        record_count: { type: integer }
        last_occurred_on: { type: string, format: date }
    WarningLetter:
      type: object
      required:
        [
          id,
          student_user_id,
          level,
          level_label,
          threshold_points,
          total_points,
          letter_number,
          issued_at,
          has_document,
        ]
      properties:
        id: { type: string, format: uuid }
        student_user_id: { type: string, format: uuid }
        level: { type: integer }
        level_label: { type: string }
        threshold_points: { type: integer }
        total_points: { type: integer }
        letter_number: { type: string }
        issued_by: { type: string, format: uuid }
        issued_at: { type: string, format: date-time }
        has_document: { type: boolean }
    SPCrossing:
      type: object
      required: [level, label, occurred_on]
      properties:
        level: { type: integer }
        label: { type: string }
        occurred_on: { type: string, format: date }
    StudentDiscipline:
      type: object
      required: [student_user_id, total_points, records, letters, due_levels, policy, first_crossed]
      properties:
        student_user_id: { type: string, format: uuid }
        total_points: { type: integer }
        records: { type: array, items: { $ref: "#/components/schemas/ViolationRecord" } }
        letters: { type: array, items: { $ref: "#/components/schemas/WarningLetter" } }
        due_levels: { type: array, items: { $ref: "#/components/schemas/SPLevel" } }
        policy: { $ref: "#/components/schemas/SPPolicy" }
        first_crossed:
          type: array
          items: { $ref: "#/components/schemas/SPCrossing" }
          description: 'The date each level was first reached ("Status SP").'
    CounselingKind:
      type: string
      enum: [individual, group, parent, referral]
    CounselingTopic:
      type: string
      enum: [career, problem, personal, learning, social, other]
      default: problem
    CounselingVisibility:
      type: string
      enum: [counselor, bk_team, leadership]
    CounselingWrite:
      type: object
      required: [student_user_id, session_at, kind, title, content]
      properties:
        student_user_id: { type: string, format: uuid }
        session_at: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/CounselingKind" }
        topic: { $ref: "#/components/schemas/CounselingTopic" }
        title: { type: string, minLength: 1, maxLength: 160 }
        content: { type: string, minLength: 1, maxLength: 20000 }
        follow_up_plan: { type: string, maxLength: 5000 }
        career_goals: { type: string, maxLength: 5000 }
        problem_description: { type: string, maxLength: 5000 }
        visibility: { $ref: "#/components/schemas/CounselingVisibility" }
    Counseling:
      type: object
      required:
        [
          id,
          student_user_id,
          counselor_user_id,
          session_at,
          kind,
          topic,
          title,
          content,
          visibility,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        student_user_id: { type: string, format: uuid }
        counselor_user_id: { type: string, format: uuid }
        session_at: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/CounselingKind" }
        topic: { $ref: "#/components/schemas/CounselingTopic" }
        title: { type: string }
        content: { type: string }
        follow_up_plan: { type: string }
        career_goals: { type: string }
        problem_description: { type: string }
        visibility: { $ref: "#/components/schemas/CounselingVisibility" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CounselingAttachment:
      type: object
      required: [id, counseling_id, created_at]
      properties:
        id: { type: string, format: uuid }
        counseling_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ViolationAttachment:
      type: object
      required: [id, record_id, created_at]
      properties:
        id: { type: string, format: uuid }
        record_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PointsPreviewEntry:
      type: object
      required: [student_user_id, total_points, issued_levels]
      properties:
        student_user_id: { type: string, format: uuid }
        total_points:
          { type: integer, description: "Active point total this year before this call." }
        issued_levels:
          type: array
          items: { type: integer }
          description: "Warning-letter levels already issued to this student, so the client does not offer one already sent."
