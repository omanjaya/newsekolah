              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/stocktakes/{stocktakeId}/close:
    post:
      tags: [library]
      operationId: closeLibraryStocktake
      x-permission: manage_library_catalog
      summary: Close a stocktake session and report missing, unexpected, and misplaced copies
      parameters:
        - { name: stocktakeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 500 }
                mark_missing_as:
                  type: string
                  enum: [lost, unknown, none]
                  default: none
                  description: What to do to a copy that was expected but never scanned
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStocktakeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

