        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/stocktakes/{stocktakeId}/results:
    get:
      tags: [library]
      operationId: getLibraryStocktakeResults
      x-permission: view_library
      summary: The persisted reconciliation of a closed session (recomputed live for an open one)
      parameters:
        - { name: stocktakeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
