          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryStocktake" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [library]
      operationId: startLibraryStocktake
      x-permission: manage_library_catalog
      summary: Start a stocktake session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                notes: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStocktake" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/stocktakes/{stocktakeId}:
    get:
      tags: [library]
      operationId: getLibraryStocktake
      x-permission: view_library
      summary: One stocktake session
      parameters:
        - { name: stocktakeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStocktake" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/stocktakes/{stocktakeId}/scans:
    post:
      tags: [library]
      operationId: scanLibraryStocktake
      x-permission: manage_library_catalog
      summary: Record a batch of scanned codes in an open stocktake session
      description: >
        Each code is matched against barcode, accession number, and RFID.
        A code matching nothing is recorded with outcome "rejected"
        instead of failing the request, so one bad scan in a batch of 200
        does not lose the rest.
      parameters:
        - { name: stocktakeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, minLength: 1, maxLength: 64 }
                location_id: { type: string, format: uuid }
      responses:
        "201":
          description: Scanned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { type: array, items: { $ref: "#/components/schemas/LibraryStocktakeScan" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/stocktakes/{stocktakeId}/progress:
