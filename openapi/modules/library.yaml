            application/json:
              schema: { $ref: "#/components/schemas/LibraryStocktakeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/stocktakes/{stocktakeId}/report.xlsx:
    get:
      tags: [library]
      operationId: getLibraryStocktakeReportXlsx
      x-permission: view_library_reports
      summary: Per-session stocktake report as XLSX (previous status, scan time, location found, misplaced)
      parameters:
