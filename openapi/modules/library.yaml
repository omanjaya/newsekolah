  /v1/opac/titles:
    get:
      tags: [library]
      operationId: searchOpacTitles
      x-public: true
      security: []
      summary: Public catalogue search (OPAC), no session required. Fulltext for a 3+ character query, LIKE below that.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: classification_prefix, in: query, schema: { type: string, maxLength: 60 } }
        - { name: material_type_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Titles
          content:
            application/json:
              schema:
                type: object
                required: [data, library_name]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryTitle" } }
                  library_name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  schemas:
    LibraryPolicy:
      type: object
      required:
        [
          version,
          loan_days,
          max_active_loans,
          max_renewals,
          renewal_days,
          fine_per_day,
          reservation_hold_days,
          name,
          saturday_closed,
          sunday_closed,
          booking_enabled,
          booking_max,
          fine_currency_enabled,
          block_loans_with_unpaid_fines,
          due_reminder_days,
          auto_register_members,
        ]
      properties:
        version: { type: integer }
        loan_days: { type: integer }
        max_active_loans: { type: integer }
        max_renewals: { type: integer }
        renewal_days: { type: integer }
        fine_per_day: { type: integer }
        reservation_hold_days: { type: integer }
        name: { type: string }
        npp: { type: string }
        barcode_source: { type: string, enum: [no_induk, item_id] }
        accession_format: { type: string }
        member_no_format: { type: string }
        saturday_closed: { type: boolean }
        sunday_closed: { type: boolean }
        booking_enabled: { type: boolean }
        booking_max: { type: integer }
        fine_currency_enabled: { type: boolean }
        block_loans_with_unpaid_fines: { type: boolean }
        due_reminder_days: { type: integer }
        auto_register_members: { type: boolean }
    LibraryPolicyWrite:
      type: object
      required:
        [
          loan_days,
          max_active_loans,
          max_renewals,
          renewal_days,
          fine_per_day,
          reservation_hold_days,
        ]
      properties:
        loan_days: { type: integer, minimum: 1 }
        max_active_loans: { type: integer, minimum: 1 }
        max_renewals: { type: integer, minimum: 0 }
        renewal_days: { type: integer, minimum: 1 }
        fine_per_day: { type: integer, minimum: 0 }
        reservation_hold_days: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        npp: { type: string, maxLength: 60 }
        barcode_source: { type: string, enum: [no_induk, item_id] }
        accession_format: { type: string, maxLength: 60 }
        member_no_format: { type: string, maxLength: 60 }
        saturday_closed: { type: boolean }
        sunday_closed: { type: boolean }
        booking_enabled: { type: boolean }
        booking_max: { type: integer, minimum: 0 }
        fine_currency_enabled: { type: boolean }
        block_loans_with_unpaid_fines: { type: boolean }
        due_reminder_days: { type: integer, minimum: 0 }
        auto_register_members: { type: boolean }

    LibraryImportRow:
      type: object
      additionalProperties: true
      description: >-
        One raw import row, keyed either by internal field name (title, main_author, publisher,
        publish_place, publish_year, isbn, ddc_number, subjects, material_type, category, access,
        location, source, acquired_on, price, no_induk, barcode, copies, call_number) when no
        mapping is given, or by whatever source column name `mapping` points each field at.
        row_number is always read directly.
    LibraryImportRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/LibraryImportRow" }
        mapping:
          type: object
          additionalProperties: { type: string }
          description: "Internal field name -> source column name, for a sheet using its own headers (INLISLite export aliases included)."
    LibraryImportPreviewRow:
      type: object
      required: [row_number, status, message, title, copies]
      properties:
        row_number: { type: integer }
        status: { type: string, enum: [new_title, existing_title, error] }
        message: { type: string }
        title: { type: string }
        copies: { type: integer }
    LibraryImportPreview:
      type: object
      required: [rows, summary]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/LibraryImportPreviewRow" } }
        summary:
          type: object
          required: [new_titles, existing_titles, copies, errors]
          properties:
            new_titles: { type: integer }
            existing_titles: { type: integer }
            copies: { type: integer }
            errors: { type: integer }
    LibraryImportCommitResult:
      type: object
      required: [created_titles, created_copies]
      properties:
        created_titles: { type: integer }
        created_copies: { type: integer }

    LibraryExternalBibliography:
      type: object
      required:
        [
          title,
          subtitle,
          main_author,
          additional_authors,
          publisher,
          publish_place,
          pages,
          isbn,
          subjects,
          language,
          abstract,
          cover_image_url,
        ]
      properties:
        title: { type: string }
        subtitle: { type: string }
        main_author: { type: string }
        additional_authors: { type: string }
        publisher: { type: string }
        publish_place: { type: string }
        publish_year: { type: integer, description: "0 when unknown" }
        pages: { type: string }
        isbn: { type: string }
        subjects: { type: string }
        language: { type: string }
        abstract: { type: string }
        cover_image_url: { type: string }
    LibraryIsbnLookupResult:
      type: object
      required: [found]
      properties:
        found: { type: boolean }
        source: { type: string, enum: [local, openlibrary, googlebooks] }
        bibliography: { $ref: "#/components/schemas/LibraryExternalBibliography" }
        local_title_id: { type: string, format: uuid }

    LibraryTitle:
      type: object
      required:
        [
          id,
          title,
          author,
          publisher,
          isbn,
          classification,
          language,
          is_opac,
          total_copies,
          available_copies,
        ]
      properties:
        id: { type: string, format: uuid }
        control_number: { type: string }
        title: { type: string }
        subtitle: { type: string }
        author: { type: string }
        responsibility: { type: string }
        additional_authors: { type: string }
        publisher: { type: string }
        publish_place: { type: string }
        publish_year: { type: integer }
        edition: { type: string }
        pages: { type: string }
        illustration: { type: string }
        dimensions: { type: string }
        isbn: { type: string }
        issn: { type: string }
        ddc_number: { type: string }
        call_number: { type: string }
        classification: { type: string }
        subjects: { type: string }
        language: { type: string }
        literary_form: { type: string }
        target_audience: { type: string }
        notes: { type: string }
        abstract: { type: string }
        material_type_id: { type: string, format: uuid }
        is_opac: { type: boolean }
        cover_asset_id: { type: string, format: uuid }
        total_copies: { type: integer }
        available_copies: { type: integer }
    LibraryTitleWrite:
      type: object
      required: [title]
      properties:
        control_number: { type: string, maxLength: 60 }
        title: { type: string, minLength: 1, maxLength: 300 }
        subtitle: { type: string, maxLength: 300 }
        author: { type: string, maxLength: 200 }
        responsibility: { type: string, maxLength: 300 }
        additional_authors: { type: string, maxLength: 500 }
        publisher: { type: string, maxLength: 200 }
        publish_place: { type: string, maxLength: 120 }
        publish_year: { type: integer, minimum: 1000, maximum: 3000 }
        edition: { type: string, maxLength: 60 }
        pages: { type: string, maxLength: 60 }
        illustration: { type: string, maxLength: 120 }
        dimensions: { type: string, maxLength: 60 }
        isbn: { type: string, maxLength: 32 }
        issn: { type: string, maxLength: 32 }
        ddc_number: { type: string, maxLength: 20 }
        call_number:
          {
            type: string,
            maxLength: 60,
            description: "Auto-generated from DDC/author/title when left empty",
          }
        classification: { type: string, maxLength: 60 }
        subjects: { type: string, maxLength: 500 }
        language: { type: string, maxLength: 10 }
        literary_form: { type: string, maxLength: 60 }
        target_audience: { type: string, maxLength: 60 }
        notes: { type: string, maxLength: 1000 }
        abstract: { type: string, maxLength: 2000 }
        material_type_id: { type: string, format: uuid }
        is_opac: { type: boolean, default: true }
        cover_asset_id: { type: string, format: uuid }
        copies:
          {
            type: integer,
            minimum: 0,
            maximum: 200,
            description: "Create this title is created with copies at once (ignored on update)",
          }

    LibraryCopyCondition:
      type: string
      enum: [good, fair, damaged, lost]
    LibraryCopyStatus:
      type: string
      enum:
        [
          available,
          on_loan,
          reserved,
          damaged,
          lost,
          in_repair,
          processing,
          donated,
          reserve_stack,
          unknown,
        ]
    LibraryCopyAccess:
      type: string
      enum: [loanable, read_in_place, reference]
    LibraryCopy:
      type: object
      required:
        [id, title_id, accession_number, barcode, copy_number, access, condition, status, is_opac]
      properties:
        id: { type: string, format: uuid }
        title_id: { type: string, format: uuid }
        accession_number: { type: string }
        barcode: { type: string }
        copy_number: { type: integer }
        call_number: { type: string }
        category_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        price: { type: integer }
        is_opac: { type: boolean }
        rfid: { type: string }
        access: { $ref: "#/components/schemas/LibraryCopyAccess" }
        condition: { $ref: "#/components/schemas/LibraryCopyCondition" }
        status: { $ref: "#/components/schemas/LibraryCopyStatus" }
        acquired_on: { type: string, format: date }
        notes: { type: string }
    LibraryCopyWrite:
      type: object
      properties:
        accession_number:
          {
            type: string,
            maxLength: 40,
            description: "Leave empty to auto-generate from the tenant's numbering pattern",
          }
        barcode:
          {
            type: string,
            maxLength: 64,
            description: "Leave empty to default to the accession number or an auto sequence",
          }
        call_number: { type: string, maxLength: 60 }
        category_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        price: { type: integer, minimum: 0 }
        is_opac: { type: boolean, default: true }
        rfid: { type: string, maxLength: 64 }
        access: { $ref: "#/components/schemas/LibraryCopyAccess" }
        condition: { $ref: "#/components/schemas/LibraryCopyCondition" }
        status: { $ref: "#/components/schemas/LibraryCopyStatus" }
        acquired_on: { type: string, format: date }
        notes: { type: string, maxLength: 500 }

    LibraryItemEventType:
      type: string
      enum: [created, status_changed, circulation, stocktake]
    LibraryItemEvent:
      type: object
      required: [id, copy_id, event_type, created_at]
      properties:
        id: { type: string, format: uuid }
        copy_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/LibraryItemEventType" }
        from_status: { type: string }
        to_status: { type: string }
        note: { type: string }
        actor_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    LibraryLoanStatus:
      type: string
      enum: [active, returned, lost]
    LibraryLoan:
      type: object
      required:
        [
          id,
          copy_id,
          title_id,
          member_user_id,
          borrowed_at,
          due_on,
          renewal_count,
          status,
          fine_amount,
        ]
      properties:
        id: { type: string, format: uuid }
        copy_id: { type: string, format: uuid }
        title_id: { type: string, format: uuid }
        member_user_id: { type: string, format: uuid }
        borrowed_at: { type: string, format: date-time }
        due_on: { type: string, format: date }
        returned_at: { type: string, format: date-time }
        renewal_count: { type: integer }
        status: { $ref: "#/components/schemas/LibraryLoanStatus" }
        fine_amount: { type: integer }
        fine_paid_at: { type: string, format: date-time }
        channel: { type: string, enum: [desk, self_service, mobile] }

    LibraryReservationStatus:
      type: string
      enum: [waiting, ready, fulfilled, cancelled, expired]
    LibraryReservation:
      type: object
      required: [id, title_id, member_user_id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        title_id: { type: string, format: uuid }
        member_user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LibraryReservationStatus" }
        requested_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        held_copy_id:
          {
            type: string,
            format: uuid,
            description: "the copy set aside for this hold, once ready",
          }
        position:
          { type: integer, description: "1-based queue position, present only while waiting" }

    LibraryStocktakeStatus:
      type: string
      enum: [open, closed]
    LibraryMarkMissingAs:
      type: string
      enum: [lost, unknown, none]
    LibraryStocktake:
      type: object
      required:
        [
          id,
          name,
          started_on,
          coordinator_user_id,
          status,
          missing_count,
          unexpected_count,
          misplaced_count,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        started_on: { type: string, format: date }
        ended_on: { type: string, format: date }
        coordinator_user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LibraryStocktakeStatus" }
        notes: { type: string }
        missing_count: { type: integer }
        unexpected_count: { type: integer }
        misplaced_count: { type: integer }
        mark_missing_as: { $ref: "#/components/schemas/LibraryMarkMissingAs" }
    LibraryStocktakeScanOutcome:
      type: string
      enum: [found, rejected]
    LibraryStocktakeScan:
      type: object
      required: [id, stocktake_id, raw_code, outcome, scanned_at]
      properties:
        id: { type: string, format: uuid }
        stocktake_id: { type: string, format: uuid }
        copy_id: { type: string, format: uuid }
        raw_code: { type: string }
        outcome: { $ref: "#/components/schemas/LibraryStocktakeScanOutcome" }
        location_id: { type: string, format: uuid }
        scanned_at: { type: string, format: date-time }
    LibraryStocktakeMisplacedCopy:
      type: object
      required: [copy, found_location_id]
      properties:
        copy: { $ref: "#/components/schemas/LibraryCopy" }
        found_location_id: { type: string, format: uuid }
    LibraryStocktakeResult:
      type: object
      required: [expected_count, scanned_count, missing, unexpected, misplaced]
      properties:
        expected_count: { type: integer }
        scanned_count: { type: integer }
        missing: { type: array, items: { $ref: "#/components/schemas/LibraryCopy" } }
        unexpected: { type: array, items: { $ref: "#/components/schemas/LibraryCopy" } }
        misplaced:
          { type: array, items: { $ref: "#/components/schemas/LibraryStocktakeMisplacedCopy" } }
    LibraryStocktakeProgress:
      type: object
      required: [expected_count, scanned_count, missing_count, misplaced_count]
      properties:
        expected_count: { type: integer }
        scanned_count: { type: integer }
        missing_count: { type: integer }
        misplaced_count: { type: integer }

    LibraryOverdueMember:
      type: object
      required: [member_user_id, loan_count, total_fine]
      properties:
        member_user_id: { type: string, format: uuid }
        loan_count: { type: integer }
        total_fine: { type: integer }
    LibraryMostBorrowedTitle:
      type: object
      required: [title, loan_count]
      properties:
        title: { $ref: "#/components/schemas/LibraryTitle" }
        loan_count: { type: integer }
    LibraryTopBorrower:
      type: object
      required: [member_user_id, member_name, class_name, loan_count]
      properties:
        member_user_id: { type: string, format: uuid }
        member_name: { type: string }
        class_name:
          { type: string, description: '"" when the member has no active class enrollment' }
        loan_count: { type: integer }
    LibraryLoanReportRow:
      type: object
      required: [loan, title, member_name]
      properties:
        loan: { $ref: "#/components/schemas/LibraryLoan" }
        title: { type: string }
        member_name: { type: string }
