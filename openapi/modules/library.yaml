paths:
  /v1/library/policy:
    get:
      tags: [library]
      operationId: getLibraryPolicy
      x-permission: view_library
      summary: Circulation policy (loan days, limits, renewal, fine per day)
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [library]
      operationId: updateLibraryPolicy
      x-permission: manage_library_settings
      summary: Replace the circulation policy (new policy version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryPolicyWrite" }
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/titles:
    get:
      tags: [library]
      operationId: listLibraryTitles
      x-permission: view_library
      summary: Catalogue search
      parameters:
        - {
            name: search,
            in: query,
            schema: { type: string, maxLength: 200 },
            description: "Fulltext for 3+ characters, substring for fewer, plus a normalized ISBN prefix match",
          }
        - { name: material_type_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: ddc_class,
            in: query,
            schema: { type: string, maxLength: 3 },
            description: "Filters by the first digits of the DDC number, e.g. '800'",
          }
        - { name: availability, in: query, schema: { type: string, enum: [available] } }
        - { name: sort, in: query, schema: { type: string, enum: [title, newest], default: title } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Titles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryTitle" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [library]
      operationId: createLibraryTitle
      x-permission: manage_library_catalog
      summary: Add a title to the catalogue, optionally with its first copies
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryTitleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryTitle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/titles/lookup:
    get:
      tags: [library]
      operationId: lookupLibraryTitleByIsbn
      x-permission: view_library
      summary: Find an existing title by ISBN, to catch duplicates before creating a new one
      parameters:
        - { name: isbn, in: query, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: Match found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryTitle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/titles/isbn-lookup:
    get:
      tags: [library]
      operationId: lookupExternalIsbn
      x-permission: manage_library_catalog
      summary: >-
        Look up bibliographic data for an ISBN: the local catalogue first, then Open Library,
        then Google Books. Never fails on an upstream outage -- found=false just means no source had it.
      parameters:
        - { name: isbn, in: query, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: Lookup result (found may be false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryIsbnLookupResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/covers/download:
    post:
      tags: [library]
      operationId: downloadLibraryCover
      x-permission: manage_library_catalog
      summary: >-
        Download a cover image from an external URL (http/https, <=3MB, jpeg/png/webp) and store
        it as an asset; pass the returned asset_id as a title's cover_asset_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2000 }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [asset_id]
                properties:
                  asset_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/titles/{titleId}:
    get:
      tags: [library]
      operationId: getLibraryTitle
      x-permission: view_library
      summary: One title with its copy availability
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Title
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryTitle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [library]
      operationId: updateLibraryTitle
      x-permission: manage_library_catalog
      summary: Edit a title's bibliographic details
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryTitleWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryTitle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [library]
      operationId: deleteLibraryTitle
      x-permission: manage_library_catalog
      summary: Remove a title; refused while it still has copies
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/titles/{titleId}/copies:
    get:
      tags: [library]
      operationId: listLibraryCopies
      x-permission: view_library
      summary: Physical copies of a title, with barcode and condition
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Copies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryCopy" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [library]
      operationId: createLibraryCopy
      x-permission: manage_library_catalog
      summary: Register a new physical copy under a title
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryCopyWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/titles/{titleId}/copies/batch:
    post:
      tags: [library]
      operationId: addLibraryCopiesBatch
      x-permission: manage_library_catalog
      summary: Add several copies of the same title at once, every number auto-generated
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 200 }
                category_id: { type: string, format: uuid }
                location_id: { type: string, format: uuid }
                source_id: { type: string, format: uuid }
                partner_id: { type: string, format: uuid }
                price: { type: integer, minimum: 0 }
                is_opac: { type: boolean, default: true }
                access: { $ref: "#/components/schemas/LibraryCopyAccess" }
                condition: { $ref: "#/components/schemas/LibraryCopyCondition" }
                notes: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryCopy" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/import/template.xlsx:
    get:
      tags: [library]
      operationId: getLibraryImportTemplateXlsx
      x-permission: manage_library_catalog
      summary: >-
        XLSX template for a collection import: 18 entry columns plus a hidden Referensi sheet
        with this tenant's master-data codes for dropdown validation
      responses:
        "200":
          description: XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/import/preview:
    post:
      tags: [library]
      operationId: previewLibraryImport
      x-permission: manage_library_catalog
      summary: >-
        Validate and dedupe-check up to 2000 import rows without writing anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryImportRequest" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/import/commit:
    post:
      tags: [library]
      operationId: commitLibraryImport
      x-permission: manage_library_catalog
      summary: >-
        Create titles (auto call number when empty) and copies for every valid row, in one
        transaction; an existing title (deduped by normalized ISBN, then title+author) only gets
        new copies added
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryImportRequest" }
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryImportCommitResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/copies:
    get:
      tags: [library]
      operationId: listLibraryCopiesFiltered
      x-permission: view_library
      summary: Copies across the whole catalogue, filtered and searched by barcode, accession number, RFID, or title
      parameters:
        - { name: title_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LibraryCopyStatus" } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Copies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryCopy" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/copies/find:
    get:
      tags: [library]
      operationId: findLibraryCopyByCode
      x-permission: view_library
      summary: Find one copy by barcode, accession number, or RFID tag
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/copies/{copyId}:
    delete:
      tags: [library]
      operationId: deleteLibraryCopy
      x-permission: manage_library_catalog
      summary: Remove a copy that was never borrowed; one with loan history is kept for the audit trail
      parameters:
        - { name: copyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/copies/{copyId}/status:
    put:
      tags: [library]
      operationId: setLibraryCopyStatus
      x-permission: manage_library_catalog
      summary: Manually change a copy's status (weeding, damage, repair); refused while the copy is on loan
      parameters:
        - { name: copyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/LibraryCopyStatus" }
                condition: { $ref: "#/components/schemas/LibraryCopyCondition" }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/copies/{copyId}/events:
    get:
      tags: [library]
      operationId: listLibraryCopyEvents
      x-permission: view_library
      summary: A copy's audit trail (created, status changes, circulation, stocktake)
      parameters:
        - { name: copyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryItemEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/copies/bulk-status:
    post:
      tags: [library]
      operationId: bulkSetLibraryCopyStatus
      x-permission: manage_library_catalog
      summary: Change up to 1000 copies to the same manual status at once; copies on loan are skipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copy_ids, status]
              properties:
                copy_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/LibraryCopyStatus" }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated copies (a copy on loan is silently skipped, not an error)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryCopy" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/copies/{copyId}/label:
    get:
      tags: [library]
      operationId: printLibraryCopyLabel
      x-permission: manage_library_catalog
      summary: Printable spine/barcode label for one copy, rendered server-side as a PDF
      parameters:
        - { name: copyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Label PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/copies/labels:
    post:
      tags: [library]
      operationId: printLibraryCopyLabels
      x-permission: manage_library_catalog
      summary: >-
        Printable spine/barcode labels for a batch of copies, one A4 page per 24 labels
        (3 columns x 8 rows of 70x25mm labels), in the given order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copy_ids]
              properties:
                copy_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Labels PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/members/{userId}/card:
    get:
      tags: [library]
      operationId: printLibraryMemberCard
      x-permission: manage_library_members
      summary: Printable membership card for a member, rendered server-side as a PDF
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Card PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/titles/{titleId}/reservations:
    get:
      tags: [library]
      operationId: listTitleReservationQueue
      x-permission: view_library
      summary: A title's reservation queue, in service order
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryReservation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/library/loans/borrow:
    post:
      tags: [library]
      operationId: borrowLibraryLoan
      x-permission: manage_library_circulation
      summary: Borrow a copy by scanning its barcode at the loan desk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode, member_user_id]
              properties:
                barcode: { type: string, minLength: 1, maxLength: 64 }
                member_user_id: { type: string, format: uuid }
                channel: { type: string, enum: [desk, self_service, mobile], default: desk }
      responses:
        "201":
          description: Borrowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryLoan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/loans/{loanId}/return:
    post:
      tags: [library]
      operationId: returnLibraryLoan
      x-permission: manage_library_circulation
      summary: Return a copy, computing any overdue fine
      parameters:
        - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                condition: { $ref: "#/components/schemas/LibraryCopyCondition" }
      responses:
        "200":
          description: Returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryLoan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/loans/{loanId}/renew:
    post:
      tags: [library]
      operationId: renewLibraryLoan
      x-permission: manage_library_circulation
      summary: Renew a loan (refused if overdue, at its renewal limit, or the title has a waiting reservation)
      parameters:
        - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryLoan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/loans/{loanId}/lost:
    post:
      tags: [library]
      operationId: markLibraryLoanLost
      x-permission: manage_library_circulation
      summary: Close a loan as lost, charging a replacement cost instead of a per-day fine
      parameters:
        - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement_cost]
              properties:
                replacement_cost: { type: integer, minimum: 0 }
                penalty: { type: string, enum: [fine, replace_book], default: fine }
                notes: { type: string, maxLength: 500 }
