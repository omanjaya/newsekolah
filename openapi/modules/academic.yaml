        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/academic/enrollments/import/template:
    get:
      tags: [academic]
      operationId: downloadEnrollmentImportTemplate
      x-permission: view_academic_data
      summary: Download the xlsx template for the class-assignment import, prefilled with the year's currently unassigned students and a class-name dropdown
      parameters:
        - $ref: "#/components/parameters/YearIdQueryParam"
      responses:
        "200":
          description: Workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/enrollments/import/preview:
    post:
      tags: [academic]
      operationId: previewEnrollmentImport
      x-permission: manage_enrollments
      summary: Parse an uploaded workbook and report what each row would do, matching students by NIS or username, without writing anything
      parameters:
        - $ref: "#/components/parameters/YearIdQueryParam"
        - name: move_existing
          in: query
          description: When false (default), a row for a student who already has an active enrollment elsewhere is reported but not applied on commit
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Row-by-row preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/enrollments/import/commit:
    post:
      tags: [academic]
      operationId: commitEnrollmentImport
      x-permission: manage_enrollments
      summary: Re-parse the same workbook and apply every row that isn't an error (assign or move); the whole file is rejected if any row is invalid unless partial=true
      parameters:
        - $ref: "#/components/parameters/YearIdQueryParam"
        - name: move_existing
          in: query
          description: When false (default), a row for a student who already has an active enrollment elsewhere is skipped, not moved
          schema:
            type: boolean
            default: false
        - name: partial
          in: query
          description: When false (default), the whole file is rejected (nothing is written) if any row is an error; when true, invalid rows are skipped and the rest is applied
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Row-by-row result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowResultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
