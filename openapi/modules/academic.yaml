components:
  parameters:
    YearIdParam:
      name: yearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    YearIdQueryParam:
      name: academic_year_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ClassIdParam:
      name: classId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DayOfWeekParam:
      name: dayOfWeek
      in: path
      required: true
      description: ISO-8601 weekday, 1 (Monday) to 7 (Sunday)
      schema:
        type: integer
        minimum: 1
        maximum: 7
    SearchParam:
      name: search
      in: query
      schema:
        type: string
        maxLength: 150
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    PageMeta:
      type: object
      required: [total, page, page_size]
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    AcademicYear:
      type: object
      required: [id, label, starts_on, ends_on, is_active]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_active:
          type: boolean
        archived_at:
          type: string
          format: date-time
    AcademicYearInput:
      type: object
      required: [label, starts_on, ends_on]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    AcademicYearList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcademicYear"
        page:
          $ref: "#/components/schemas/PageMeta"
    Term:
      type: object
      required: [id, academic_year_id, name, sequence, starts_on, ends_on, is_active]
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        name:
          type: string
        sequence:
          type: integer
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_active:
          type: boolean
    TermInput:
      type: object
      required: [name, sequence, starts_on, ends_on]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        sequence:
          type: integer
          minimum: 1
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    TermUpdateInput:
      type: object
      required: [name, starts_on, ends_on]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    CalendarEventKind:
