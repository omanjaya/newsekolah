paths:
  /v1/academic/years:
    get:
      tags: [academic]
      operationId: listAcademicYears
      x-permission: view_academic_data
      summary: List academic years
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Academic years
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYearList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: createAcademicYear
      x-permission: manage_academic_years
      summary: Create an academic year (and seed its terms from the calendar.terms policy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/years/{yearId}:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    get:
      tags: [academic]
      operationId: getAcademicYear
      x-permission: view_academic_data
      summary: Get one academic year
      responses:
        "200":
          description: Academic year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [academic]
      operationId: updateAcademicYear
      x-permission: manage_academic_years
      summary: Update an academic year's label and period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/years/{yearId}/activate:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    post:
      tags: [academic]
      operationId: activateAcademicYear
      x-permission: manage_academic_years
      summary: Activate this year; deactivates every other year for the tenant (transactional, exactly one active)
      responses:
        "204":
          description: Activated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The year is archived and cannot be reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/academic/years/{yearId}/archive:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    post:
      tags: [academic]
      operationId: archiveAcademicYear
      x-permission: manage_academic_years
      summary: Archive this year (must not be the active year)
      responses:
        "204":
          description: Archived
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/years/{yearId}/terms:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    get:
      tags: [academic]
      operationId: listTerms
      x-permission: view_academic_data
      summary: List terms for an academic year
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Term"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: createTerm
      x-permission: manage_academic_years
      summary: Add a term to an academic year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/terms/{termId}:
    parameters:
      - name: termId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [academic]
      operationId: updateTerm
      x-permission: manage_academic_years
      summary: Update a term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [academic]
      operationId: deleteTerm
      x-permission: manage_academic_years
      summary: Delete a term
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/terms/{termId}/activate:
    parameters:
      - name: termId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [academic]
      operationId: activateTerm
      x-permission: manage_academic_years
      summary: Activate this term; deactivates every other term in the same academic year
      responses:
        "204":
          description: Activated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/academic/years/{yearId}/calendar-events:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    get:
      tags: [academic]
      operationId: listCalendarEvents
      x-permission: view_academic_data
      summary: List calendar events for an academic year
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/CalendarEventKind"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: createCalendarEvent
      x-permission: manage_academic_years
      summary: Add a calendar event (holiday, exam, event, no_school, semester_break)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/calendar-events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [academic]
      operationId: updateCalendarEvent
      x-permission: manage_academic_years
      summary: Update a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [academic]
      operationId: deleteCalendarEvent
      x-permission: manage_academic_years
      summary: Delete a calendar event
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/years/{yearId}/school-days:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    get:
      tags: [academic]
      operationId: listSchoolDays
      x-permission: view_academic_data
      summary: List which weekdays are school days for this academic year
      responses:
        "200":
          description: School days
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SchoolDay"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/years/{yearId}/school-days/{dayOfWeek}:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
      - $ref: "#/components/parameters/DayOfWeekParam"
    put:
      tags: [academic]
      operationId: setSchoolDay
      x-permission: manage_academic_years
      summary: Mark one weekday as a school day or not, for this academic year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/grade-levels:
    get:
      tags: [academic]
      operationId: listGradeLevels
      x-permission: view_academic_data
      summary: List grade levels
      responses:
        "200":
          description: Grade levels
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GradeLevel"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: createGradeLevel
      x-permission: manage_master_data
      summary: Create a grade level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeLevelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeLevel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/grade-levels/apply-template:
    post:
      tags: [academic]
      operationId: applyGradeLevelTemplate
      x-permission: manage_master_data
      summary: Create the standard grade levels for an education level (SD 1-6, SMP 7-9, SMA/SMK X-XII); existing codes are skipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  $ref: "#/components/schemas/GradeLevelTemplate"
      responses:
        "200":
          description: Grade levels created (existing codes were skipped, not duplicated)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GradeLevel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/grade-levels/{gradeLevelId}:
    parameters:
      - name: gradeLevelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [academic]
      operationId: updateGradeLevel
      x-permission: manage_master_data
      summary: Update a grade level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeLevelInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeLevel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [academic]
      operationId: deleteGradeLevel
      x-permission: manage_master_data
      summary: Delete a grade level (fails if any class still references it)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/tracks:
    get:
      tags: [academic]
      operationId: listTracks
      x-permission: view_academic_data
      summary: List tracks (majors)
      responses:
        "200":
          description: Tracks
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: createTrack
      x-permission: manage_master_data
      summary: Create a track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/tracks/{trackId}:
    parameters:
      - name: trackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [academic]
      operationId: updateTrack
      x-permission: manage_master_data
      summary: Update a track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [academic]
      operationId: deleteTrack
      x-permission: manage_master_data
      summary: Delete a track (fails if any class still references it)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/classes:
    get:
      tags: [academic]
      operationId: listClasses
      x-permission: view_academic_data
      summary: List classes in an academic year
      parameters:
        - $ref: "#/components/parameters/YearIdQueryParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: grade_level_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: createClass
      x-permission: manage_master_data
      summary: Create a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/classes/{classId}:
    parameters:
      - $ref: "#/components/parameters/ClassIdParam"
    get:
      tags: [academic]
      operationId: getClass
      x-permission: view_academic_data
      summary: Get one class
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [academic]
      operationId: updateClass
      x-permission: manage_master_data
      summary: Update a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [academic]
      operationId: deleteClass
      x-permission: manage_master_data
      summary: Delete a class (fails if it has active enrollments or teaching assignments)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/classes/{classId}/enrollments:
    parameters:
      - $ref: "#/components/parameters/ClassIdParam"
    get:
      tags: [academic]
      operationId: listClassEnrollments
      x-permission: view_academic_data
      summary: List active enrollments for a class
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [academic]
      operationId: assignStudent
      x-permission: manage_enrollments
      summary: Assign one student to this class (must have no active enrollment this year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignStudentInput"
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/academic/classes/{classId}/enrollments/bulk:
    parameters:
      - $ref: "#/components/parameters/ClassIdParam"
    post:
      tags: [academic]
      operationId: bulkAssignStudents
      x-permission: manage_enrollments
      summary: Assign several students to this class; a student who already has an active enrollment this year is skipped, not failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignInput"
      responses:
        "200":
          description: Assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAssignResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/enrollments/{enrollmentId}/move:
    parameters:
      - name: enrollmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [academic]
      operationId: moveStudent
      x-permission: manage_enrollments
      summary: Move the enrolled student to a different class; closes the old enrollment row (moved) and opens a new one, preserving history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveStudentInput"
      responses:
        "201":
          description: New enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/academic/enrollments/{enrollmentId}/leave:
    parameters:
      - name: enrollmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [academic]
      operationId: removeStudentFromClass
      x-permission: manage_enrollments
      summary: Close the student's active enrollment as "left" mid-year (leaving the school, not moving class)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveStudentInput"
      responses:
        "200":
          description: Closed enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/academic/years/{yearId}/unassigned-students:
    parameters:
      - $ref: "#/components/parameters/YearIdParam"
    get:
      tags: [academic]
      operationId: listUnassignedStudents
      x-permission: view_academic_data
      summary: List students with no active enrollment in this academic year
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Unassigned students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSummaryList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/promotion/preview:
    post:
      tags: [academic]
      operationId: previewPromotion
      x-permission: manage_enrollments
      summary: Compute (without writing) how every actively-enrolled student in from_year_id would promote into to_year_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
      responses:
        "200":
          description: Promotion plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/promotion/commit:
    post:
      tags: [academic]
      operationId: commitPromotion
      x-permission: manage_enrollments
      summary: Apply the promotion plan (re-computed server-side from the same inputs); items with no resolvable target class are skipped, not partially applied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionCommitRequest"
      responses:
        "200":
          description: Promotion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionCommitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/academic/new-year-setup/preview:
    post:
      tags: [academic]
      operationId: previewNewYearSetup
      x-permission: manage_academic_years
      summary: Compute (without writing) which subject offerings and classes from_year_id has that to_year_id does not yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewYearSetupRequest"
      responses:
        "200":
          description: New academic year setup plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewYearSetupPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/academic/new-year-setup/commit:
    post:
      tags: [academic]
      operationId: commitNewYearSetup
      x-permission: manage_academic_years
      summary: Copy every subject offering and class from_year_id has that to_year_id does not yet have; re-running an already-applied commit copies nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewYearSetupRequest"
      responses:
        "200":
