paths:
  /v1/attendance/me/today:
    get:
      tags: [attendance]
      operationId: listMyAttendanceToday
      x-permission: view_attendance
      summary: Sessions for one day for the current teacher (own schedules plus accepted substitutions)
      parameters:
        - name: date
          in: query
          description: Defaults to today in the tenant's timezone.
          schema: { type: string, format: date }
        - name: current_only
          in: query
          description: Restrict to occurrences whose period is running right now.
          schema: { type: boolean, default: false }
        - name: teacher_user_id
          in: query
          description: List another teacher's day instead of the caller's own. Requires manage_attendance.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceSessionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/attendance/sessions:
    post:
      tags: [attendance]
      operationId: openAttendanceSession
      x-permission: manage_attendance
      summary: Open (idempotently) the session for a schedule occurrence and return its full recording payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule_id, date]
              properties:
                schedule_id: { type: string, format: uuid }
                date: { type: string, format: date }
                mode:
                  type: string
                  enum: [normal, correction]
                  default: normal
                  description:
                    correction lets a global corrector or the class's homeroom teacher open a session neither
                    taught nor substituted for.
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSessionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/attendance/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [attendance]
      operationId: getAttendanceSession
      x-permission: view_attendance
      summary: One session's full recording payload
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSessionDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/attendance/sessions/{sessionId}/entries:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [attendance]
      operationId: saveAttendanceEntries
      x-permission: manage_attendance
      summary: Save a batch of student statuses and the lesson journal for a session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAttendanceEntriesRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSessionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The save or correction window for this session has closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/attendance/me/calendar:
    get:
      tags: [attendance]
      operationId: getMyAttendanceCalendar
      x-permission: authenticated
      summary: The current student's daily status for one month
      parameters:
        - name: month
          in: query
          required: true
          description: "YYYY-MM"
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceCalendarDay" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/attendance/homeroom:
    get:
      tags: [attendance]
      operationId: getHomeroomAttendance
      x-permission: view_attendance
      summary: One day's daily status for every student in the caller's homeroom class, with guardian and discipline info
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: search
          in: query
          description: Case-insensitive match on the student's name or NIS.
          schema: { type: string }
        - name: status_code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Homeroom roster with daily status
          content:
            application/json:
              schema:
                type: object
                required: [data, total, status_counts]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceHomeroomEntry" }
                  total:
                    type: integer
                    description: Total students matching search/status_code, ignoring limit/offset.
                  status_counts:
                    type: object
                    additionalProperties: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/attendance/reports/daily:
    get:
      tags: [attendance]
      operationId: getDailyAttendanceReport
      x-permission: view_reports
      summary: One class's expected vs. submitted sessions and per-student status for one day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: class_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDailyReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/attendance/reports/daily/mine:
    get:
      tags: [attendance]
      operationId: getOwnDailyAttendanceReport
      x-permission: view_attendance
      summary:
        The "own sessions" report scope for a teacher without view_reports -- every session they submitted on a
        date, as the schedule's own teacher or an accepted substitute, across every class they taught that day.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Own submitted sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceDailyReportSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/attendance/reports/daily/export:
    get:
      tags: [attendance]
      operationId: exportDailyAttendanceReport
      x-permission: view_reports
      summary: The daily report as an XLSX or PDF file, for one class or every class of a grade level
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: class_id
          in: query
          description: Exactly one of class_id or grade_level_id is required.
          schema: { type: string, format: uuid }
        - name: grade_level_id
          in: query
          description:
            Every class of the tenant's active academic year under this grade level, one sheet per class. Exactly
            one of class_id or grade_level_id is required.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ReportFormatParam"
        - $ref: "#/components/parameters/ReportTitleParam"
        - $ref: "#/components/parameters/ReportLetterheadParam"
        - $ref: "#/components/parameters/ReportColumnsParam"
      responses:
        "200":
          description: Report file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/attendance/reports/monthly:
    get:
      tags: [attendance]
      operationId: getMonthlyAttendanceSummary
      x-permission: view_reports
      summary: One student's daily statuses for one month
      parameters:
        - name: student_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          description: "YYYY-MM"
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [data, totals]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceCalendarDay" }
                  totals:
                    type: object
                    additionalProperties: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/attendance/reports/monthly/export:
    get:
      tags: [attendance]
      operationId: exportMonthlyAttendanceReport
      x-permission: view_reports
      summary:
        The monthly recap as an XLSX or PDF file, for one class or every class of a grade level -- one row per
        student (NIS, name, one column per attendance status, total, percentage present), one section per class.
      parameters:
        - name: month
          in: query
          required: true
          description: "YYYY-MM"
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        - name: class_id
          in: query
          description: Exactly one of class_id or grade_level_id is required.
          schema: { type: string, format: uuid }
        - name: grade_level_id
          in: query
          description:
            Every class of the tenant's active academic year under this grade level, one sheet per class. Exactly
            one of class_id or grade_level_id is required.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/ReportFormatParam"
        - $ref: "#/components/parameters/ReportTitleParam"
        - $ref: "#/components/parameters/ReportLetterheadParam"
        - $ref: "#/components/parameters/ReportColumnsParam"
      responses:
        "200":
          description: Report file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/monitor/snapshot:
    get:
      tags: [monitor]
      operationId: getMonitorSnapshot
      x-public: true
      security: []
      summary: Public monitor-display snapshot, gated by the tenant's monitor.display_token setting
      parameters:
        - $ref: "#/components/parameters/MonitorTokenHeader"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/monitor/presence:
    get:
      tags: [monitor]
      operationId: getMonitorPresence
      x-permission: view_monitor_presence
      summary: Who currently has a realtime socket open, by role
      responses:
        "200":
          description: Presence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /ws/monitor:
    get:
      tags: [monitor]
      operationId: wsMonitor
      x-public: true
      security: []
      summary:
        Realtime monitor channel (WebSocket upgrade). Authenticated by the same monitor.display_token as
        GET /v1/monitor/snapshot, passed as a query parameter since browsers cannot set custom headers before the
        handshake completes.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols
        "401": { $ref: "#/components/responses/Unauthorized" }
  /ws/me:
    get:
      tags: [monitor]
      operationId: wsMe
      x-public: true
      security: []
      summary:
        Realtime per-user channel (WebSocket upgrade). Authenticated by the access token, sent either as a bearer
        Authorization header (native clients) or as a `bearer.<token>` WebSocket subprotocol (browsers).
      responses:
        "101":
          description: Switching Protocols
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  parameters:
    MonitorTokenHeader:
      name: X-Monitor-Token
      in: header
      required: true
      description: The tenant's configured monitor.display_token setting.
      schema: { type: string }
  schemas:
    AttendanceStatusDef:
      type: object
      required: [code, label, color, counts_as_present]
      properties:
        code: { type: string }
        label: { type: string }
        color: { type: string }
        counts_as_present: { type: boolean }
    AttendanceSessionSummary:
      type: object
      required:
        - id
        - schedule_id
        - date
        - class_id
        - subject_id
        - teacher_user_id
        - start_period_id
        - end_period_id
        - is_substitute
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        date: { type: string, format: date }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        substitute_user_id: { type: string, format: uuid }
        start_period_id: { type: string, format: uuid }
        end_period_id: { type: string, format: uuid }
        is_substitute: { type: boolean }
        submitted_at: { type: string, format: date-time }
    AttendanceRosterItem:
      type: object
      required: [student_user_id, name]
      properties:
        student_user_id: { type: string, format: uuid }
        name: { type: string }
        previous_status: { type: string }
        current_status: { type: string }
        source: { type: string, enum: [teacher, leave, permit, system] }
        notes: { type: string }
        blocked: { type: boolean }
        blocked_reason: { type: string }
    AttendanceSessionDetail:
      allOf:
        - $ref: "#/components/schemas/AttendanceSessionSummary"
        - type: object
          required: [meeting_number, statuses, roster]
          properties:
            meeting_number: { type: integer }
            previous_journal_topic: { type: string }
            statuses:
              type: array
              items: { $ref: "#/components/schemas/AttendanceStatusDef" }
            roster:
              type: array
              items: { $ref: "#/components/schemas/AttendanceRosterItem" }
            journal_topic: { type: string }
            journal_activities: { type: string }
            journal_reflection: { type: string }
            skipped_blocked_student_ids:
              type: array
              description:
                Students silently skipped by the last save because Blocker reported an unresolved workflow for them
                (e.g. a pending late-arrival review); neither saved nor rejected.
              items: { type: string, format: uuid }
    SaveAttendanceEntriesRequest:
      type: object
      required: [entries]
      properties:
        mode: { type: string, enum: [normal, correction], default: normal }
        reason: { type: string, maxLength: 500, description: Required when mode is correction. }
        entries:
          type: array
          items:
            type: object
            required: [student_user_id, status_code]
            properties:
              student_user_id: { type: string, format: uuid }
              status_code: { type: string }
              notes: { type: string, maxLength: 300 }
              violation_ids:
                type: array
                description: This session's discipline violation type IDs for this student, replacing whatever was recorded before.
                items: { type: string, format: uuid }
        journal:
          type: object
          required: [topic, activities]
          properties:
            topic: { type: string, maxLength: 300 }
            activities: { type: string }
            reflection: { type: string }
    AttendanceCalendarDaySession:
      type: object
      required: [schedule_id, subject_id]
      properties:
        schedule_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        subject_name: { type: string }
        teacher_user_id: { type: string, format: uuid }
        teacher_name: { type: string }
        period_label: { type: string }
        status_code: { type: string }
        note: { type: string }
        source: { type: string, enum: [teacher, leave, permit, system] }
    AttendanceCalendarDay:
      type: object
      required: [date, status_code, expected_sessions, submitted_sessions, complete]
      properties:
        date: { type: string, format: date }
        status_code: { type: string }
        expected_sessions: { type: integer }
        submitted_sessions: { type: integer }
        complete: { type: boolean }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AttendanceCalendarDaySession" }
    AttendanceRosterEntry:
      type: object
      required:
        [student_user_id, name, status_code, expected_sessions, submitted_sessions, complete]
      properties:
        student_user_id: { type: string, format: uuid }
        name: { type: string }
        status_code: { type: string }
        expected_sessions: { type: integer }
        submitted_sessions: { type: integer }
        complete: { type: boolean }
        partial_absence:
          type: boolean
          description: At least one submitted session that day was Alpha, even when status_code resolved to something else.
    AttendanceHomeroomEntry:
      allOf:
        - $ref: "#/components/schemas/AttendanceRosterEntry"
        - type: object
          properties:
            nis: { type: string }
            guardian_name: { type: string }
            guardian_phone: { type: string }
            violation_count: { type: integer }
            violation_points: { type: integer }
    AttendanceDailyReportSessionEntry:
      type: object
      required: [student_user_id, name, status_code]
      properties:
        student_user_id: { type: string, format: uuid }
        name: { type: string }
        status_code: { type: string }
        notes: { type: string }
    AttendanceDailyReportSession:
      type: object
      required:
        [
          session_id,
          class_id,
          class_name,
          subject_id,
          subject_name,
          teacher_user_id,
          teacher_name,
          period_label,
          entries,
        ]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        class_name: { type: string }
        subject_id: { type: string, format: uuid }
        subject_name: { type: string }
        teacher_user_id: { type: string, format: uuid }
        teacher_name: { type: string }
        period_label: { type: string }
        submitted_at: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/AttendanceDailyReportSessionEntry" }
    AttendanceDailyReport:
      type: object
      required:
        [class_id, date, expected_sessions, submitted_sessions, complete, students, status_counts]
      properties:
        class_id: { type: string, format: uuid }
        date: { type: string, format: date }
        expected_sessions: { type: integer }
        submitted_sessions: { type: integer }
        complete: { type: boolean }
        students:
          type: array
          items: { $ref: "#/components/schemas/AttendanceRosterEntry" }
        status_counts:
          type: object
          additionalProperties: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AttendanceDailyReportSession" }
    MonitorSessionCard:
      type: object
      required: [class_name, subject_name, teacher_name, status]
      properties:
        class_name: { type: string }
        subject_name: { type: string, description: "Empty when status is no_schedule." }
        teacher_name: { type: string, description: "Empty when status is no_schedule." }
        substitute_name:
          {
            type: string,
            description: "Set only when a substitute teacher actually took the session.",
          }
        status: { type: string, enum: [not_started, in_progress, submitted, no_schedule] }
    MonitorPeriod:
      type: object
      required: [name, starts_at, ends_at]
      properties:
        name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    MonitorSnapshot:
      type: object
      required: [generated_at, date, day_name, status_counts, sessions]
      properties:
        generated_at: { type: string, format: date-time }
        date: { type: string, format: date }
        day_name: { type: string, description: "Indonesian weekday name (Senin, Selasa, ...)." }
        current_period:
          $ref: "#/components/schemas/MonitorPeriod"
          description: Omitted when no schedule anywhere is currently in its period.
        status_counts:
          type: object
          additionalProperties: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/MonitorSessionCard" }
    PresenceSnapshot:
      type: object
      required: [count, keys, by_role]
      properties:
        count: { type: integer }
        keys:
          type: array
          items: { type: string }
        by_role:
          type: object
          additionalProperties: { type: integer }
          description: Open connections grouped by role, parsed from each key's "role:userID" shape.
