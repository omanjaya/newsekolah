paths:
  /v1/analytics/at-risk-students:
    get:
      tags: [analytics]
      operationId: listAtRiskStudents
      x-permission: view_early_warning
      summary: >-
        Early-warning risk list, scoped to the caller: a counselor or
        school leadership sees every class, a homeroom teacher sees only
        their own class.
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/StudentRisk" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/analytics/at-risk-students/{studentId}:
    get:
      tags: [analytics]
      operationId: getStudentRisk
      x-permission: view_early_warning
      summary: One student's risk signals and the reasons behind the level
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentRiskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/analytics/policy:
    get:
      tags: [analytics]
      operationId: getEarlyWarningPolicy
      x-permission: view_early_warning
      summary: Tenant's early-warning thresholds and weights
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyWarningPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [analytics]
      operationId: updateEarlyWarningPolicy
      x-permission: manage_early_warning_rules
      summary: Replace the early-warning policy (new policy version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EarlyWarningPolicyWrite" }
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyWarningPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/analytics/admin-dashboard:
    get:
      tags: [analytics]
      operationId: getAdminDashboard
      x-permission: view_dashboard
      summary: >-
        Operational snapshot for Admin/Super Admin: active users per profile
        kind, pending approval queues, online presence per role, and a 7-day
        login histogram. Restricted to the admin/super_admin system roles
        regardless of who else holds view_dashboard.
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    AdminDashboard:
      type: object
      required: [active_users, pending, online_by_role, login_histogram]
      properties:
        active_users:
          type: object
          description: Active user count per profile_kind (student/teacher/staff); a kind with no active users is omitted.
          additionalProperties: { type: integer }
        pending:
          type: object
          description: Count of in-progress instances per workflow kind.
          required: [leave_request, exit_permit, late_arrival]
          properties:
            leave_request: { type: integer }
            exit_permit: { type: integer }
            late_arrival: { type: integer }
        online_by_role:
          type: object
          description: Live socket count per role slug, from the heartbeat every open /ws/me connection sends. A role nobody is connected under is omitted rather than reported as zero.
          additionalProperties: { type: integer }
        login_histogram:
          type: array
          description: Exactly 24 entries, index = UTC hour of day, value = successful logins in that hour over the last 7 days.
          minItems: 24
          maxItems: 24
          items: { type: integer }
        attendance_today:
          $ref: "#/components/schemas/AttendanceTodayProgress"
    AttendanceTodayProgress:
      type: object
      description: >-
        How many classes with a session running right now have submitted
        attendance, out of how many such classes exist. Both zero when
        nothing is currently in session.
      required: [submitted, total]
      properties:
        submitted: { type: integer }
        total: { type: integer }
    RiskLevel:
      type: string
      enum: [none, watch, at_risk]
    RiskReason:
      type: object
      required: [code, weight, params]
      description: >-
        One observation that contributed to the level: a stable code plus
        the exact numbers observed (e.g. absent_days, considered_days),
        never a characterisation of the student. The UI renders the code
        as localized text with the params filled in.
      properties:
        code: { type: string }
        weight: { type: integer }
        params:
          type: object
          additionalProperties: true
    RiskSignals:
      type: object
      required:
        [
          has_attendance,
          considered_days,
          absent_days,
          active_violation_count,
          discipline_points,
          warning_letter_count,
          has_grade_trend,
          previous_average,
          current_average,
        ]
      properties:
        has_attendance: { type: boolean }
        considered_days: { type: integer }
        absent_days: { type: integer }
        active_violation_count: { type: integer }
        discipline_points: { type: integer }
        warning_letter_count: { type: integer }
        has_grade_trend: { type: boolean }
        previous_average: { type: number }
        current_average: { type: number }
    StudentRisk:
      type: object
      required: [student_user_id, class_id, level, score, computed_at]
      properties:
        student_user_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/RiskLevel" }
        score: { type: integer }
        computed_at: { type: string, format: date-time }
    StudentRiskDetail:
      type: object
      required: [student_user_id, class_id, level, score, signals, reasons, computed_at]
      properties:
        student_user_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/RiskLevel" }
        score: { type: integer }
        signals: { $ref: "#/components/schemas/RiskSignals" }
        reasons: { type: array, items: { $ref: "#/components/schemas/RiskReason" } }
        computed_at: { type: string, format: date-time }
    EarlyWarningPolicy:
      type: object
      required:
        [
          version,
          window_days,
          attendance_watch_rate,
          attendance_at_risk_rate,
          discipline_watch_points,
          discipline_at_risk_points,
          warning_letter_watch_count,
          warning_letter_at_risk_count,
          grade_drop_watch_points,
          grade_drop_at_risk_points,
          attendance_weight,
          discipline_weight,
          warning_weight,
          grade_weight,
          watch_score,
          at_risk_score,
        ]
      properties:
        version: { type: integer }
        window_days: { type: integer, minimum: 1 }
        attendance_watch_rate: { type: number, minimum: 0, maximum: 1 }
        attendance_at_risk_rate: { type: number, minimum: 0, maximum: 1 }
        discipline_watch_points: { type: integer, minimum: 1 }
        discipline_at_risk_points: { type: integer, minimum: 1 }
        warning_letter_watch_count: { type: integer, minimum: 1 }
        warning_letter_at_risk_count: { type: integer, minimum: 1 }
        grade_drop_watch_points: { type: number, minimum: 0 }
        grade_drop_at_risk_points: { type: number, minimum: 0 }
        attendance_weight: { type: integer, minimum: 1 }
        discipline_weight: { type: integer, minimum: 1 }
        warning_weight: { type: integer, minimum: 1 }
        grade_weight: { type: integer, minimum: 1 }
        watch_score: { type: integer, minimum: 1 }
        at_risk_score: { type: integer, minimum: 1 }
    EarlyWarningPolicyWrite:
      allOf:
        - $ref: "#/components/schemas/EarlyWarningPolicy"
