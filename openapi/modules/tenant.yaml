paths:
  /v1/tenant/branding:
    get:
      tags:
        - tenant
      operationId: getTenantBranding
      x-public: true
      security: []
      summary: Public branding for the resolved tenant (login screen, manifest)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBranding"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/lookup:
    get:
      tags:
        - tenant
      operationId: lookupTenants
      x-public: true
      security: []
      summary:
        Search schools by name or slug (mobile school picker). Returns nothing in single-tenant mode except the single
        tenant.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  schemas:
    TenantSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
    TenantBranding:
      type: object
      required:
        - tenant_id
        - slug
        - name
        - accent_color
        - locale
        - timezone
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        short_name:
          type: string
        product_name:
          type: string
          description: Platform-wide product name (interim "SION"); use as app title fallback.
        tagline:
          type: string
        logo_url:
          type: string
          format: uri
        favicon_url:
          type: string
          format: uri
        accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        locale:
          type: string
          enum:
            - id
            - en
        timezone:
          type: string
