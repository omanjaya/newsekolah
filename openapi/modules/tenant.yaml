paths:
  /v1/tenant/branding:
    get:
      tags:
        - tenant
      operationId: getTenantBranding
      x-public: true
      security: []
      summary: Public branding for the resolved tenant (login screen, manifest)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBranding"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/lookup:
    get:
      tags:
        - tenant
      operationId: lookupTenants
      x-public: true
      security: []
      summary:
        Search schools by name or slug (mobile school picker). Returns nothing in single-tenant mode except the single
        tenant.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/tenant/setup:
    get:
      tags: [tenant]
      operationId: getSetupChecklist
      x-permission: manage_settings
      summary: What the school still has to configure before it can operate
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupChecklist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/profile:
    put:
      tags: [tenant]
      operationId: updateSchoolProfile
      x-permission: manage_settings
      summary: The school's name, level, timezone and default language
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolProfileWrite" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    SetupStep:
      type: object
      required: [key, done, count, required]
      properties:
        key: { type: string }
        done: { type: boolean }
        count: { type: integer }
        required: { type: boolean }
    SetupChecklist:
      type: object
      required: [steps, required_done, required_total, ready_to_operate]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/SetupStep" } }
        required_done: { type: integer }
        required_total: { type: integer }
        ready_to_operate: { type: boolean }
        active_year_label: { type: string }
    SchoolProfileWrite:
      type: object
      required: [name, education_level, timezone, locale]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        education_level: { type: string, enum: [sd, smp, sma, smk, other] }
        timezone: { type: string, maxLength: 60 }
        locale: { type: string, enum: [id, en] }
    TenantSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
    TenantBranding:
      type: object
      required:
        - tenant_id
        - slug
        - name
        - accent_color
        - locale
        - timezone
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        short_name:
          type: string
        product_name:
          type: string
          description: Platform-wide product name (interim "SION"); use as app title fallback.
        tagline:
          type: string
        logo_url:
          type: string
          format: uri
        favicon_url:
          type: string
          format: uri
        accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        locale:
          type: string
          enum:
            - id
            - en
        timezone:
          type: string
