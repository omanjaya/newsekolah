paths:
  /v1/tenant/branding:
    get:
      tags:
        - tenant
      operationId: getTenantBranding
      x-public: true
      security: []
      summary: Public branding for the resolved tenant (login screen, manifest)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBranding"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/lookup:
    get:
      tags:
        - tenant
      operationId: lookupTenants
      x-public: true
      security: []
      summary:
        Search schools by name or slug (mobile school picker). Returns nothing in single-tenant mode except the single
        tenant.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/tenant/setup:
    get:
      tags: [tenant]
      operationId: getSetupChecklist
      x-permission: manage_settings
      summary: What the school still has to configure before it can operate
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupChecklist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/profile:
    put:
      tags: [tenant]
      operationId: updateSchoolProfile
      x-permission: manage_settings
      summary: The school's name, level, timezone and default language
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolProfileWrite" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/onboarding/level-templates:
    get:
      tags: [tenant]
      operationId: listLevelTemplates
      x-permission: manage_settings
      summary: The SD/SMP/SMA/SMK starting points the onboarding wizard's first step can apply
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LevelTemplateSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/onboarding/level-templates/apply:
    post:
      tags: [tenant]
      operationId: applyLevelTemplate
      x-permission: manage_settings
      summary:
        Create every grade level, subject, and bell-schedule period a template defines that the tenant does not
        already have. Safe to call more than once, or with more than one level, since existing rows are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: { type: string, enum: [sd, smp, sma, smk] }
      responses:
        "200":
          description: What was created and what already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LevelTemplateReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/onboarding/dapodik/preview:
    post:
      tags: [tenant]
      operationId: previewDapodikImport
      x-permission: manage_settings
      summary:
        Parse an uploaded Dapodik student-export CSV and report, per row, what it would do -- create, update
        (matched by NISN), or an error -- without writing anything
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Row-by-row preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DapodikImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/tenant/onboarding/dapodik/commit:
    post:
      tags: [tenant]
      operationId: commitDapodikImport
      x-permission: manage_settings
      summary:
        Re-parse the same CSV and apply every row that is not an error. Re-running with the same file is safe --
        rows already matched by NISN become updates, not duplicate students.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Row-by-row result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DapodikImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/tenant/onboarding/seed-sample-data:
    post:
      tags: [tenant]
      operationId: seedSampleData
      x-permission: manage_settings
      summary:
        Fill a brand-new tenant with a demo academic year, an SMA level template, and one demo class. Refused once
        the tenant has any real data (an academic year, grade level, class, subject, or student).
      responses:
        "200":
          description: What was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedSampleDataReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  schemas:
    SetupStep:
      type: object
      required: [key, done, count, required]
      properties:
        key: { type: string }
        done: { type: boolean }
        count: { type: integer }
        required: { type: boolean }
    SetupChecklist:
      type: object
      required: [steps, required_done, required_total, ready_to_operate]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/SetupStep" } }
        required_done: { type: integer }
        required_total: { type: integer }
        ready_to_operate: { type: boolean }
        active_year_label: { type: string }
    SchoolProfileWrite:
      type: object
      required: [name, education_level, timezone, locale]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        education_level: { type: string, enum: [sd, smp, sma, smk, other] }
        timezone: { type: string, maxLength: 60 }
        locale: { type: string, enum: [id, en] }
    TenantSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
    TenantBranding:
      type: object
      required:
        - tenant_id
        - slug
        - name
        - accent_color
        - locale
        - timezone
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        short_name:
          type: string
        product_name:
          type: string
          description: Platform-wide product name (interim "SION"); use as app title fallback.
        tagline:
          type: string
        logo_url:
          type: string
          format: uri
        favicon_url:
          type: string
          format: uri
        accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        locale:
          type: string
          enum:
            - id
            - en
        timezone:
          type: string
    LevelTemplateSummary:
      type: object
      required: [key, name, grade_level_count, subject_count, period_count]
      properties:
        key: { type: string, enum: [sd, smp, sma, smk] }
        name: { type: string }
        grade_level_count: { type: integer }
        subject_count: { type: integer }
        period_count: { type: integer }
    LevelTemplateItemStatus:
      type: string
      enum: [created, skipped]
    LevelTemplateItem:
      type: object
      required: [kind, code, name, status]
      properties:
        kind: { type: string, enum: [grade_level, subject, period] }
        code: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/LevelTemplateItemStatus" }
    LevelTemplateReport:
      type: object
      required: [template, items, created, skipped]
      properties:
        template: { type: string, enum: [sd, smp, sma, smk] }
        items:
          type: array
          items: { $ref: "#/components/schemas/LevelTemplateItem" }
        created: { type: integer }
        skipped: { type: integer }
    DapodikImportAction:
      type: string
      enum: [create, update, error]
    DapodikImportRow:
      type: object
      required: [row_number, action]
      properties:
        row_number: { type: integer }
        name: { type: string }
        nisn: { type: string }
        class_name: { type: string }
        action: { $ref: "#/components/schemas/DapodikImportAction" }
        errors:
          type: array
          items: { type: string }
    DapodikImportReport:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DapodikImportRow" }
    SeedSampleDataReport:
      type: object
      required: [academic_year_label, class_name, template]
      properties:
        academic_year_label: { type: string }
        class_name: { type: string }
        template: { $ref: "#/components/schemas/LevelTemplateReport" }
