paths:
  /v1/schedules:
    get:
      tags: [scheduling]
      operationId: listSchedules
      x-permission: view_schedules
      summary: Grid of schedules for a class, a teacher, or one day, merged into contiguous blocks
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: class_id
          in: query
          schema: { type: string, format: uuid }
        - name: teacher_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: day_of_week
          in: query
          description: 1 (Monday) through 7 (Sunday)
          schema: { type: integer, minimum: 1, maximum: 7 }
        - name: as_of
          in: query
          description: >-
            Any date in the week to show. Each weekday lists the lessons in effect on that weekday's date in the
            same Monday-Sunday week, so a change that takes effect mid-week shows the old lesson before it and the
            new one from it. Default: today in the school's time zone. Clamped to the academic year.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Schedule blocks
          content:
            application/json:
              schema:
                type: object
                required: [data, week_starts_on]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ScheduleBlock" }
                  week_starts_on:
                    type: string
                    format: date
                    description: The Monday of the week the blocks were resolved for.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [scheduling]
      operationId: createSchedule
      x-permission: authenticated
      summary: Create a schedule (admin for any teacher, or a teacher for themselves within the edit deadline)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleWriteRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ScheduleConflict" }
  /v1/schedules/bulk-import:
    post:
      tags: [scheduling]
      operationId: bulkImportSchedules
      x-permission: manage_schedules
      summary: Create many schedules atomically (typically after clearing the academic year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedules]
              properties:
                schedules:
                  type: array
                  items: { $ref: "#/components/schemas/ScheduleWriteRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/ScheduleConflict" }
  /v1/schedules/clear:
    post:
      tags: [scheduling]
      operationId: clearSchedules
      x-permission: manage_schedules
      summary: Clear one academic year's timetable, entirely or from a date on
      description: >-
        Without effective_from every schedule of the year is deleted, which fails with SCHEDULE_HAS_HISTORY when
        any of them has history. With it the timetable is cleared from that date on: each lesson ends on its last
        date before it (or goes when it has none) and every earlier week keeps its lessons and history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_year_id]
              properties:
                academic_year_id: { type: string, format: uuid }
                effective_from:
                  type: string
                  format: date
                  description: First date the timetable is empty. Not before today nor on or before a date with history.
      responses:
        "204": { description: Cleared }
        "409": { $ref: "#/components/responses/ScheduleConflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/schedules/teacher-options:
    get:
      tags: [scheduling]
      operationId: listTeacherOptions
      x-permission: authenticated
      summary: Active teachers for a schedule form's teacher dropdown; a teacher without manage_schedules or manage_master_data sees only themselves
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/SearchParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Teacher options
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [scheduling]
      operationId: getSchedule
      x-permission: view_schedules
      summary: One schedule
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [scheduling]
      operationId: updateSchedule
      x-permission: authenticated
      summary: Update a schedule (admin, or the owning teacher within the edit deadline)
      description: >-
        With effective_from in the body the change takes effect from that date: the block ends on its last lesson
        before it and a new version (a new id, returned) starts on its first lesson on or after it. Without it the
        block is corrected in place for the whole academic year, which fails with SCHEDULE_HAS_HISTORY once it has
        history.
      parameters:
        - name: schedule_ids
          in: query
          description: All rows of a merged block, including scheduleId. The operation is atomic.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleWriteRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ScheduleConflict" }
    delete:
      tags: [scheduling]
      operationId: deleteSchedule
      x-permission: authenticated
      summary: Delete a schedule (admin, or the owning teacher within the edit deadline)
      description: >-
        Without effective_from the block is deleted outright, which fails with SCHEDULE_HAS_HISTORY once it has
        history. With effective_from (manage_schedules only) the block is removed from that date on: earlier dates
        keep it, with everything recorded against it.
      parameters:
        - name: schedule_ids
          in: query
          description: All rows of a merged block, including scheduleId. The operation is atomic.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
        - name: effective_from
          in: query
          description: Remove the block from this date on; earlier dates keep it. See MutationPolicy.min_effective_from.
          schema: { type: string, format: date }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/ScheduleConflict" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/substitutions:
    get:
      tags: [scheduling]
      operationId: listSubstitutions
      x-permission: view_schedules
      summary:
        Substitution requests directed at me (incoming), made by me (outgoing), or (requires manage_schedules) every
        request tenant-wide (all)
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing, all] }
        - name: status
          in: query
          description: Only with direction=all.
          schema: { type: string, enum: [pending, accepted, rejected, cancelled] }
      responses:
        "200":
          description: Substitution requests
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Substitution" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [scheduling]
      operationId: createSubstitution
      x-permission: view_schedules
      summary: Request a substitute for one dated occurrence of my own schedule
      description: >-
        The date must fall on the schedule's weekday and inside its effective dates; a date after this version of
        the lesson ended (or before it started) is refused with SUBSTITUTION_LESSON_NOT_ON_DATE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubstitutionCreateRequest" }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Substitution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/substitutions/eligible-substitutes:
    get:
      tags: [scheduling]
      operationId: listEligibleSubstitutes
      x-permission: view_schedules
      summary: Active teachers this academic year eligible to substitute, excluding the caller, with a name search
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Eligible teachers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubstituteCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/substitutions/{substitutionId}/respond:
    parameters:
      - name: substitutionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [scheduling]
      operationId: respondSubstitution
      x-permission: view_schedules
      summary: Accept or reject a substitution request addressed to me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Substitution" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/substitutions/{substitutionId}/cancel:
    parameters:
      - name: substitutionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [scheduling]
      operationId: cancelSubstitution
      x-permission: view_schedules
      summary: Cancel a substitution request I made
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Substitution" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/journals:
    get:
      tags: [journals]
      operationId: listJournals
      x-permission: authenticated
      summary:
        My own journals for an academic year, or (class_id given, requires view_journals_all) every journal for a
        class
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: class_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          description: Case-insensitive substring match on topic or activities.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Journals
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Journal" }
                  total:
                    {
                      type: integer,
                      description: "Total journals matching the filter, ignoring limit/offset.",
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [journals]
      operationId: upsertJournal
      x-permission: authenticated
      summary: Create a journal for a class/subject/date (unique per day), or edit one by id
      description: >
        Without `id` this only creates: a lesson that already has a journal
        answers 409 JOURNAL_CONFLICT instead of replacing it, unless the
        stored journal says exactly the same (a repeated submit), which is
        returned unchanged. With `id` it edits that journal, its lesson
        included.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalWriteRequest" }
      responses:
        "200":
          description: Created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The lesson already has a different journal (JOURNAL_CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/journals/export:
    get:
      tags: [journals]
      operationId: exportJournals
      x-permission: authenticated
      summary: Export journals as XLSX, PDF, or DOCX
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: class_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
        - name: format
          in: query
          required: true
          description:
            docx keeps its own fixed layout (no title/letterhead/columns customisation); xlsx and pdf go through
            reportdoc and honour the params below.
          schema: { type: string, enum: [xlsx, pdf, docx] }
        - $ref: "#/components/parameters/ReportTitleParam"
        - $ref: "#/components/parameters/ReportLetterheadParam"
        - $ref: "#/components/parameters/ReportColumnsParam"
      responses:
        "200":
          description: File
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/journals/{journalId}:
    parameters:
      - name: journalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [journals]
      operationId: getJournal
      x-permission: authenticated
      summary: One journal
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [journals]
      operationId: deleteJournal
      x-permission: authenticated
      summary: Delete a journal (its own teacher/writer only)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  responses:
    ScheduleConflict:
      description: >-
        Schedule overlaps another lesson (SCHEDULE_CONFLICT_CLASS / SCHEDULE_CONFLICT_TEACHER, details name the
        clashing lesson and its effective dates), the year is archived (SCHEDULE_YEAR_ARCHIVED), history prevents
        an undated change (SCHEDULE_HAS_HISTORY, details give the earliest effective_from), the change date is too
        early (SCHEDULE_CHANGE_BEFORE_HISTORY, details give the earliest effective_from), or the lesson already
        ended (SCHEDULE_ENDED).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    UserOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ScheduleSource:
      type: string
      enum: [admin, teacher, import]
    MutationPolicy:
      type: object
      required: [can_edit, can_delete]
      properties:
        can_edit: { type: boolean }
        can_delete: { type: boolean }
        has_history:
          type: boolean
          description: >-
            The schedule has recorded attendance or a substitution request; changes must carry effective_from and
            leave earlier dates as they were.
        requires_effective_from:
          type: boolean
          description: An edit or delete must say from which date it takes effect (effective_from).
        min_effective_from:
          type: string
          format: date
          description: The earliest effective_from the server accepts (today, or the day after the last history date).
        reason: { type: string }
    Schedule:
      type: object
      required:
        - id
        - academic_year_id
        - class_id
        - subject_id
        - teacher_user_id
        - day_of_week
        - start_period_id
        - end_period_id
        - source
        - effective_from
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_period_id: { type: string, format: uuid }
        end_period_id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ScheduleSource" }
        notes: { type: string }
        effective_from:
          type: string
          format: date
          description: First date this version of the lesson is on the timetable (on its weekday).
        effective_until:
          type: string
          format: date
          description: Last date this version is on the timetable (inclusive); absent while it runs to the end of the year.
        mutation_policy: { $ref: "#/components/schemas/MutationPolicy" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScheduleBlock:
      type: object
      required:
        [
          schedule_ids,
          class_id,
          subject_id,
          teacher_user_id,
          day_of_week,
          start_seq,
          end_seq,
          source,
          effective_from,
        ]
      properties:
        schedule_ids:
          type: array
          items: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        day_of_week: { type: integer }
        start_seq: { type: integer }
        end_seq: { type: integer }
        source: { $ref: "#/components/schemas/ScheduleSource" }
        effective_from:
          type: string
          format: date
          description: First date the block is on the timetable.
        effective_until:
          type: string
          format: date
          description: Last date the block is on the timetable (inclusive); absent while it runs to the end of the year.
        has_history:
          type: boolean
          description: >-
            Some schedule in the block has recorded attendance or a substitution request: it can no longer be
            corrected in place, only changed or removed from a date after that history.
        mutation_policy:
          $ref: "#/components/schemas/MutationPolicy"
          description: What the caller may do with the block; present for callers with manage_schedules.
    ScheduleWriteRequest:
      type: object
      required:
        [
          academic_year_id,
          class_id,
          subject_id,
          teacher_user_id,
          day_of_week,
          start_period_id,
          end_period_id,
        ]
      properties:
        academic_year_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_period_id: { type: string, format: uuid }
        end_period_id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ScheduleSource" }
        notes: { type: string, maxLength: 500 }
        effective_from:
          type: string
          format: date
          description: >-
            Create and bulk import: first date the lesson is on the timetable (default: the start of the academic
            year), moved to the next date on its weekday. Update: the date the change takes effect; omit it to
            correct the block in place (SCHEDULE_HAS_HISTORY once it has history). manage_schedules only.
    SubstitutionStatus:
      type: string
      enum: [pending, accepted, rejected, cancelled]
    Substitution:
      type: object
      required:
        - id
        - academic_year_id
        - schedule_id
        - date
        - requester_user_id
        - substitute_user_id
        - status
        - created_at
      properties:
        id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        date: { type: string, format: date }
        requester_user_id: { type: string, format: uuid }
        substitute_user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SubstitutionStatus" }
        requester_note: { type: string }
        response_note: { type: string }
        responded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        # Set on the incoming/outgoing (self) list scopes, where the server
        # already joins the covered schedule; left unset on the
        # manage_schedules-only "all" scope, which does not.
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        start_period_id: { type: string, format: uuid }
        end_period_id: { type: string, format: uuid }
    SubstituteCandidate:
      type: object
      required: [user_id, name]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
    SubstitutionCreateRequest:
      type: object
      required: [schedule_id, date, substitute_user_id]
      properties:
        schedule_id: { type: string, format: uuid }
        date: { type: string, format: date }
        substitute_user_id: { type: string, format: uuid }
        note: { type: string, maxLength: 500 }
    Journal:
      type: object
      required:
        - id
        - academic_year_id
        - teacher_user_id
        - written_by_user_id
        - class_id
        - subject_id
        - lesson_date
        - topic
        - activities
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        written_by_user_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        lesson_date: { type: string, format: date }
        topic: { type: string }
        activities: { type: string }
