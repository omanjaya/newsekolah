paths:
  /v1/reports:
    get:
      tags: [reports]
      operationId: listReports
      x-permission: authenticated
      summary: Reports this user may run, with the arguments each one needs
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ReportDefinition" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/reports/{reportKind}/export:
    get:
      tags: [reports]
      operationId: exportReport
      x-permission: authenticated
      summary: Run one report and download it as XLSX or PDF
      description: >
        format/title/letterhead/columns customise the downloaded file (see
        docs/05-shared-components.md, "Laporan dan ekspor"); every report
        kind accepts them. grade_level_id is an additional scope every
        class-scoped kind accepts in place of class_id, to export one
        section per class in the grade level; the two are mutually
        exclusive.
      parameters:
        - { name: reportKind, in: path, required: true, schema: { type: string } }
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: grade_level_id,
            in: query,
            description: "Every class of this grade level, one section per class; mutually exclusive with class_id",
            schema: { type: string, format: uuid },
          }
        - { name: subject_id, in: query, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [xlsx, pdf], default: xlsx } }
        - { name: title, in: query, schema: { type: string, maxLength: 200 } }
        - { name: letterhead, in: query, schema: { type: boolean, default: true } }
        - {
            name: columns,
            in: query,
            schema: { type: string },
            description: "Comma-separated column keys, each optionally `key:Label` (URL-encoded); empty/absent keeps every column.",
          }
      responses:
        "200":
          description: Workbook or PDF, depending on format
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/reports/{reportKind}/columns:
    get:
      tags: [reports]
      operationId: listReportColumns
      x-permission: authenticated
      summary: Columns one report scope would render, without the row data
      description: >
        Computes the same columns exportReport would use for this exact
        scope (same query parameters, minus format/title/letterhead/
        columns), so the export dialog can offer a report whose columns
        are not fully static -- discipline.points' one column per
        tenant-configured SP level, grading.report_scores' one column per
        assessment component -- instead of only a fixed list. Every other
        kind answers too (its own static columns), rather than 404ing.
      parameters:
        - { name: reportKind, in: path, required: true, schema: { type: string } }
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - { name: grade_level_id, in: query, schema: { type: string, format: uuid } }
        - { name: subject_id, in: query, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Columns
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ReportColumn" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/reports/schedules:
    get:
      tags: [reports]
      operationId: listReportSchedules
      x-permission: manage_report_schedules
      summary: Recurring exports configured for this tenant
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ReportSchedule" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [reports]
      operationId: createReportSchedule
      x-permission: manage_report_schedules
      summary: Schedule a recurring export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportScheduleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/reports/schedules/{scheduleId}:
    put:
      tags: [reports]
      operationId: updateReportSchedule
      x-permission: manage_report_schedules
      summary: Edit a recurring export
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportScheduleWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [reports]
      operationId: deleteReportSchedule
      x-permission: manage_report_schedules
      summary: Remove a recurring export
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/reports/schedules/{scheduleId}/enabled:
    put:
      tags: [reports]
      operationId: setReportScheduleEnabled
      x-permission: manage_report_schedules
      summary: Turn a recurring export on or off without editing it
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/reports/schedules/{scheduleId}/runs:
    get:
      tags: [reports]
      operationId: listReportScheduleRuns
      x-permission: manage_report_schedules
      summary: Run history for one recurring export, most recent first
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ReportScheduleRun" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    ReportArgumentKind:
      type: string
      enum: [class, grade_level, subject, date, term]
    ReportArgument:
      type: object
      required: [name, kind, required]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ReportArgumentKind" }
        required: { type: boolean }
    ReportDefinition:
      type: object
      required: [kind, permission, arguments]
      properties:
        kind: { type: string }
        permission: { type: string }
        arguments: { type: array, items: { $ref: "#/components/schemas/ReportArgument" } }

    ReportColumn:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }

    ReportScheduleCadence:
      type: string
      enum: [daily, weekly, monthly]
    ReportScheduleFormat:
      type: string
      enum: [xlsx, pdf]
    ReportScheduleParams:
      type: object
      properties:
        class_id: { type: string, format: uuid }
        grade_level_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
    ReportScheduleWrite:
      type: object
      required: [report_kind, cadence, hour, recipients]
      properties:
        report_kind: { type: string }
        params: { $ref: "#/components/schemas/ReportScheduleParams" }
        cadence: { $ref: "#/components/schemas/ReportScheduleCadence" }
        format:
          allOf: [{ $ref: "#/components/schemas/ReportScheduleFormat" }]
          description: File type to render; defaults to xlsx when omitted
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Required when cadence is weekly (0 = Sunday .. 6 = Saturday)
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: Required when cadence is monthly; clamped to the last day of shorter months
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour to run in the tenant's own timezone
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
    ReportSchedule:
      allOf:
        - $ref: "#/components/schemas/ReportScheduleWrite"
        - type: object
          required: [id, enabled, next_run_at, created_by, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            enabled: { type: boolean }
            next_run_at: { type: string, format: date-time }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ReportScheduleRunStatus:
      type: string
      enum: [pending, success, failed]
    ReportScheduleRun:
      type: object
      required: [id, schedule_id, due_at, status, error_message, created_at]
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ReportScheduleRunStatus" }
        error_message: { type: string }
        object_key: { type: string }
        ran_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
