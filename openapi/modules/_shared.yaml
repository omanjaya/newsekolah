components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Conflict:
      description: The request conflicts with existing state (duplicate, dependents, or state machine)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description:
                Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
  parameters:
    # Shared query-param contract for every export endpoint built on
    # apps/api/internal/platform/reportdoc's Document/Options: format,
    # title, letterhead and columns. Each report endpoint that supports
    # this contract lists these four alongside its own scope parameters
    # (month, employeeId, ...); a request with none of them keeps that
    # endpoint's old behaviour (xlsx, every column, letterhead on if the
    # tenant configured one) so existing callers never break.
    ReportFormat:
      name: format
      in: query
      description: xlsx (default) or pdf
      schema: { type: string, enum: [xlsx, pdf] }
    ReportTitle:
      name: title
      in: query
      description: Overrides the report's default title
      schema: { type: string, maxLength: 200 }
    ReportLetterhead:
      name: letterhead
      in: query
      description: Show the tenant's letterhead (default true; has no visible effect until the tenant has configured one)
      schema: { type: boolean }
    ReportColumns:
      name: columns
      in: query
      description: >-
        Comma-separated column selection and order, each entry "key" or
        "key:label" (URL-encoded). Omitted or empty keeps every column in
        the report's own order.
      schema: { type: string }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description:
        Client-generated key (mobile clients on unstable networks) that makes a POST/PUT safe to retry;
        docs/08-security.md section 7. The same key replays the first response instead of repeating the write.
      schema:
        type: string
        maxLength: 100
