components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Conflict:
      description: The request conflicts with existing state (duplicate, dependents, or state machine)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description:
                Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description:
        Client-generated key (mobile clients on unstable networks) that makes a POST/PUT safe to retry;
        docs/08-security.md section 7. The same key replays the first response instead of repeating the write.
      schema:
        type: string
        maxLength: 100
    # The reportdoc query-param contract every report export endpoint that has migrated onto
    # apps/api/internal/platform/reportdoc shares (docs/05-shared-components.md, "Laporan dan ekspor"): a
    # customisable letterhead (kop laporan) and column set, rendered as XLSX or PDF. Omitting every one of these
    # params keeps a migrated endpoint's old behaviour (xlsx, every column, letterhead on if the tenant configured
    # one) so an existing caller, including the mobile app, never breaks.
    ReportFormatParam:
      name: format
      in: query
      description: Rendered file type. Defaults to xlsx.
      schema: { type: string, enum: [xlsx, pdf], default: xlsx }
    ReportTitleParam:
      name: title
      in: query
      description: Overrides the report's own default title.
      schema: { type: string, maxLength: 200 }
    ReportLetterheadParam:
      name: letterhead
      in: query
      description: Show the tenant's configured letterhead (kop laporan). Defaults to true.
      schema: { type: boolean, default: true }
    ReportColumnsParam:
      name: columns
      in: query
      description:
        Comma-separated column selection and order, each entry either a bare column key or "key:label" to rename
        it. Omitted or empty keeps every column, in the report's own default order and labels.
      schema: { type: string }
