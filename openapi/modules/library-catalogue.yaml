paths:
  /v1/library/material-types:
    get:
      tags: [library]
      operationId: listLibraryMaterialTypes
      x-permission: view_library
      summary: Material types (book, magazine, ...), each with its own loan limits
      responses:
        "200":
          description: Material types
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LibraryMaterialType" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [library]
      operationId: createLibraryMaterialType
      x-permission: manage_library_catalog
      summary: Add a material type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryMaterialTypeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryMaterialType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/library/material-types/{id}:
    put:
      tags: [library]
      operationId: updateLibraryMaterialType
      x-permission: manage_library_catalog
      summary: Edit a material type
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryMaterialTypeWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryMaterialType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [library]
      operationId: deleteLibraryMaterialType
      x-permission: manage_library_catalog
      summary: Remove a material type; refused while any title uses it
