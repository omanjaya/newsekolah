components:
  schemas:
    LibraryMasterEntry:
      type: object
      required: [id, code, name, is_active, sort_order]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        sort_order: { type: integer }
    LibraryMasterEntryWrite:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 120 }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }

    LibraryMaterialType:
      type: object
      required: [id, code, name, max_loan_items, max_loan_days, max_renewals, is_active, sort_order]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        max_loan_items: { type: integer }
        max_loan_days: { type: integer }
        max_renewals: { type: integer }
        is_active: { type: boolean }
        sort_order: { type: integer }
    LibraryMaterialTypeWrite:
      type: object
      required: [code, name, max_loan_items, max_loan_days, max_renewals]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 120 }
        max_loan_items: { type: integer, minimum: 1 }
        max_loan_days: { type: integer, minimum: 1 }
        max_renewals: { type: integer, minimum: 0 }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }

    LibraryPartner:
      type: object
      required: [id, code, name, is_active, sort_order]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        contact_name: { type: string }
        phone: { type: string }
        address: { type: string }
        is_active: { type: boolean }
        sort_order: { type: integer }
    LibraryPartnerWrite:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 200 }
        contact_name: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 40 }
        address: { type: string, maxLength: 300 }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }

    LibraryDDCClass:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    LibraryCatalogueOptions:
      type: object
      required:
        [
          material_types,
          collection_categories,
          acquisition_sources,
          partners,
          locations,
          ddc_classes,
        ]
      properties:
        material_types: { type: array, items: { $ref: "#/components/schemas/LibraryMaterialType" } }
        collection_categories:
          { type: array, items: { $ref: "#/components/schemas/LibraryMasterEntry" } }
        acquisition_sources:
          { type: array, items: { $ref: "#/components/schemas/LibraryMasterEntry" } }
        partners: { type: array, items: { $ref: "#/components/schemas/LibraryPartner" } }
        locations: { type: array, items: { $ref: "#/components/schemas/LibraryMasterEntry" } }
        ddc_classes: { type: array, items: { $ref: "#/components/schemas/LibraryDDCClass" } }

    LibraryDDCClassCount:
      type: object
      required: [code, name, title_count]
      properties:
        code: { type: string }
        name: { type: string }
        title_count: { type: integer }
    LibraryMasterEntryCount:
      type: object
      required: [id, code, name, count]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        count: { type: integer }
    LibraryCatalogueSummary:
      type: object
      required:
        [
          titles_by_ddc,
          items_by_category,
          items_by_material_type,
          fiction_count,
          fiction_total,
          additions_in_period,
          loans_in_period,
          active_borrowers,
          overdue_now,
          students_total,
          members_total,
          items_per_student,
          loans_per_student,
          visits_in_period,
          visits_per_student,
        ]
      properties:
        titles_by_ddc: { type: array, items: { $ref: "#/components/schemas/LibraryDDCClassCount" } }
        items_by_category:
          { type: array, items: { $ref: "#/components/schemas/LibraryMasterEntryCount" } }
        items_by_material_type:
          { type: array, items: { $ref: "#/components/schemas/LibraryMasterEntryCount" } }
        fiction_count: { type: integer }
        fiction_total: { type: integer }
        additions_in_period: { type: integer }
        loans_in_period: { type: integer }
        active_borrowers: { type: integer }
        overdue_now: { type: integer }
        last_stocktake: { $ref: "#/components/schemas/LibraryStocktake" }
        students_total:
          { type: integer, description: "Active students (users of kind student, status active)" }
        members_total: { type: integer }
        items_per_student: { type: number, format: double }
        loans_per_student: { type: number, format: double }
        visits_in_period: { type: integer }
        visits_per_student: { type: number, format: double }

    LibraryClassCount:
      type: object
      required: [class_name, count]
      properties:
        class_name: { type: string, description: '"Lainnya" for no active class enrollment' }
        count: { type: integer }
    LibraryDayCount:
      type: object
      required: [day, count]
      properties:
        day: { type: string, format: date }
        count: { type: integer }
    LibraryVisitsReport:
      type: object
      required: [total, per_day, per_class]
      properties:
        total: { type: integer }
        per_day:
          type: array
          items: { $ref: "#/components/schemas/LibraryDayCount" }
        per_class: { type: array, items: { $ref: "#/components/schemas/LibraryClassCount" } }
    LibraryMemberTypeCount:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        count: { type: integer }
    LibraryMembersReport:
      type: object
      required: [total, active, per_type, per_class]
      properties:
        total: { type: integer }
        active: { type: integer }
        per_type: { type: array, items: { $ref: "#/components/schemas/LibraryMemberTypeCount" } }
        per_class: { type: array, items: { $ref: "#/components/schemas/LibraryClassCount" } }

    LibraryDashboardSummary:
      type: object
      required:
        [
          titles,
          copies,
          available,
          on_loan,
          overdue,
          members,
          active_members,
          visits_today,
          loans_today,
          returns_today,
          unpaid_fines_total,
        ]
      properties:
        titles: { type: integer }
        copies: { type: integer }
        available: { type: integer }
        on_loan: { type: integer }
        overdue: { type: integer }
        members: { type: integer }
        active_members: { type: integer }
        visits_today: { type: integer }
        loans_today: { type: integer }
        returns_today: { type: integer }
        unpaid_fines_total: { type: integer }
    LibraryDashboardSeriesPoint:
      type: object
      required: [day, loans, returns]
      properties:
        day: { type: string, format: date }
        loans: { type: integer }
        returns: { type: integer }
    LibraryDashboard:
      type: object
      required: [summary, latest_loans, longest_overdue, popular_titles, series]
      properties:
        summary: { $ref: "#/components/schemas/LibraryDashboardSummary" }
        latest_loans: { type: array, items: { $ref: "#/components/schemas/LibraryLoan" } }
        longest_overdue: { type: array, items: { $ref: "#/components/schemas/LibraryLoan" } }
        popular_titles:
          { type: array, items: { $ref: "#/components/schemas/LibraryMostBorrowedTitle" } }
        series: { type: array, items: { $ref: "#/components/schemas/LibraryDashboardSeriesPoint" } }
