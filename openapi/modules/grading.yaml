paths:
  /v1/grading/scale:
    get:
      tags: [grading]
      operationId: getGradingScale
      x-permission: authenticated
      summary: The school's grading scale and report-increase cap
      responses:
        "200":
          description: Scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradingScale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [grading]
      operationId: updateGradingScale
      x-permission: manage_settings
      summary: Replace the grading scale (new policy version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradingScaleWrite" }
      responses:
        "200":
          description: Scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradingScale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/gradebook:
    get:
      tags: [grading]
      operationId: getGradebook
      x-permission: view_grades
      summary: One class-subject sheet with components, students and scores
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: subject_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Gradebook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gradebook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/gradebook/export:
    get:
      tags: [grading]
      operationId: exportGradebook
      x-permission: view_grades
      summary:
        The gradebook as an XLSX or PDF file, for one class or every class of a grade level -- one section per
        class, using the same data GET /v1/grading/gradebook shows (NOT the e-Rapor export, which stays separate).
      parameters:
        - name: class_id
          in: query
          description: Exactly one of class_id or grade_level_id is required.
          schema: { type: string, format: uuid }
        - name: grade_level_id
          in: query
          description:
            Every class of the tenant's active academic year under this grade level, one section per class. Exactly
            one of class_id or grade_level_id is required.
          schema: { type: string, format: uuid }
        - { name: subject_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ReportFormatParam"
        - $ref: "#/components/parameters/ReportTitleParam"
        - $ref: "#/components/parameters/ReportLetterheadParam"
        - $ref: "#/components/parameters/ReportColumnsParam"
      responses:
        "200":
          description: Report file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/components:
    post:
      tags: [grading]
      operationId: createAssessmentComponent
      x-permission: manage_grades
      summary: Add an assessment component to a class-subject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentComponentWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentComponent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/grading/components/{componentId}:
    put:
      tags: [grading]
      operationId: updateAssessmentComponent
      x-permission: manage_grades
      summary: Edit a component
      parameters:
        - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentComponentWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentComponent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [grading]
      operationId: deleteAssessmentComponent
      x-permission: manage_grades
      summary: Delete a component (refused once it has grades)
      parameters:
        - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/grading/components/{componentId}/scores:
    put:
      tags: [grading]
      operationId: saveComponentScores
      x-permission: manage_grades
      summary: Save one component's column and recompute report scores
      description: A null score deletes that student's grade for the component.
      parameters:
        - { name: componentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [student_user_id]
                    properties:
                      student_user_id: { type: string, format: uuid }
                      score: { type: [number, "null"] }
      responses:
        "200":
          description: Sheet after saving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gradebook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/grading/report-scores/manual:
    put:
      tags: [grading]
      operationId: setManualReportScore
      x-permission: manage_grades
      summary: Override one student's report score for a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_id, subject_id, student_user_id]
              properties:
                class_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                student_user_id: { type: string, format: uuid }
                term_id: { type: string, format: uuid }
                manual_score: { type: [number, "null"] }
      responses:
        "200":
          description: Score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportScore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/grading/publications:
    put:
      tags: [grading]
      operationId: setGradePublication
      x-permission: manage_grades
      summary: Publish or unpublish one class-subject's grades to students
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class_id, subject_id, is_published]
              properties:
                class_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                term_id: { type: string, format: uuid }
                is_published: { type: boolean }
      responses:
        "200":
          description: Publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradePublication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/grade-ranges:
    get:
      tags: [grading]
      operationId: listGradeRanges
      x-permission: view_grades
      summary: Report-score increase ranges for this year
      responses:
        "200":
          description: Ranges
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GradeRange" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [grading]
      operationId: createGradeRange
      x-permission: manage_settings
      summary: Add a single report-score increase range (admin ad hoc)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeRangeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradeRange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [grading]
      operationId: replaceGradeRanges
      x-permission: manage_grades
      summary: Replace every range of one subject-teacher scope
      description: >-
        A plain teacher (manage_grades) may only target teacher_user_id
        equal to themselves, or omit it to mean themselves; a curriculum
        lead or admin (manage_master_data or manage_settings) may target
        another teacher or omit it to mean a school-wide range. The set of
        ranges submitted is validated together (no overlap) and replaces
        whatever was saved before for that scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, ranges]
              properties:
                subject_id: { type: string, format: uuid }
                teacher_user_id: { type: string, format: uuid }
                ranges:
                  type: array
                  items:
                    type: object
                    required: [min_score, max_score, increase_amount]
                    properties:
                      min_score: { type: number }
                      max_score: { type: number }
                      increase_amount: { type: number, minimum: 0 }
      responses:
        "200":
          description: Ranges after replacing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GradeRange" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/grading/grade-ranges/{rangeId}:
    delete:
      tags: [grading]
      operationId: deleteGradeRange
      x-permission: manage_settings
      summary: Remove a range
      parameters:
        - { name: rangeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/tp-mappings:
    get:
      tags: [grading]
      operationId: listTPMappings
      x-permission: view_grades
      summary: TP export-code mappings of one class-subject-term
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: subject_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TPMapping" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [grading]
      operationId: saveTPMapping
      x-permission: manage_grades
      summary: Create or replace one component's TP export mapping
      description: >-
        Only components of kind formative, or the tenant's configured TP
        kind, are eligible. export_code must be unique among the sibling
        components of the same class, subject and term.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TPMappingWrite" }
      responses:
        "200":
          description: Mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TPMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/grading/tp-mappings/{mappingId}:
    delete:
      tags: [grading]
      operationId: deleteTPMapping
      x-permission: manage_grades
      summary: Remove one component's TP export mapping
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/grades:
    get:
      tags: [grading]
      operationId: getMyGrades
      x-permission: view_own_grades
      summary: The current student's published grades and star balance
      parameters:
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Grades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyGrades" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/me/stars:
    get:
      tags: [grading]
      operationId: getMyStars
      x-permission: view_own_grades
      summary: The current student's own star total, grouped by subject and teacher
      description: Counts only events the teacher marked visible to the student.
      responses:
        "200":
          description: Stars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyStars" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/stars:
    post:
      tags: [grading]
      operationId: giveStar
      x-permission: manage_grades
      summary: Add or subtract stars for a student (balance never goes negative)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_user_id, class_id, delta]
              properties:
                student_user_id: { type: string, format: uuid }
                class_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                delta: { type: integer }
                note: { type: string, maxLength: 300 }
                visible_to_student: { type: boolean, default: true }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [event, balance]
                properties:
                  event: { $ref: "#/components/schemas/StarEvent" }
                  balance: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/grading/stars/{studentId}:
    get:
      tags: [grading]
      operationId: getStarLedger
      x-permission: manage_grades
      summary: One student's star ledger and balance
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                type: object
                required: [data, balance]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/StarEvent" } }
                  balance: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/grading/stars/class/{classId}:
    get:
      tags: [grading]
      operationId: listClassStarBalances
      x-permission: manage_grades
      summary: Star balances of one class
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [student_user_id, balance]
                      properties:
                        student_user_id: { type: string, format: uuid }
                        balance: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/erapor/preview:
    get:
      tags: [grading]
      operationId: previewEraporExport
      x-permission: view_grades
      summary: What an e-Rapor export for one class and term would contain, before downloading it
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EraporPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/erapor/export:
    get:
      tags: [grading]
      operationId: exportErapor
      x-permission: view_grades
      summary: Download the e-Rapor import file for one class and term
      description: >-
        Refuses with GRADES_NOT_PUBLISHED (403) when none of the class's
        subjects have published grades for the term. The skip report travels
        with the file itself (a second sheet for XLSX, a trailing section
        for CSV); call previewEraporExport first to see it without
        downloading.
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: format,
            in: query,
            schema: { $ref: "#/components/schemas/EraporFormat", default: xlsx },
          }
      responses:
        "200":
          description: e-Rapor import file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/grading/erapor/export-legacy:
    get:
      tags: [grading]
      operationId: exportEraporLegacy
      x-permission: view_grades
      summary: Download the old per-subject e-Rapor sheet
      description: >-
        The legacy layout: No / NIS / Nama / Nilai Rapor / one column per
        mapped TP export code (T|R, with a dropdown) / Validasi. Kept
        alongside exportErapor (the current NISN/predicate layout) for
        schools whose import tooling still expects this shape.
      parameters:
        - { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: subject_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: e-Rapor legacy sheet
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    GradingScale:
      type: object
      required: [version, min, max, report_increase_max, default_kktp, round_decimal]
      properties:
        version: { type: integer }
        min: { type: number }
        max: { type: number }
        report_increase_max: { type: number }
        default_kktp: { type: number }
        round_decimal: { type: integer }
        tp_kind:
          allOf: [{ $ref: "#/components/schemas/AssessmentComponentKind" }]
          description: The extra component kind (beyond formative) eligible for TP export mapping.
    GradingScaleWrite:
      type: object
      required: [min, max, report_increase_max, default_kktp, round_decimal]
      properties:
        min: { type: number }
        max: { type: number }
        report_increase_max: { type: number, minimum: 0 }
        default_kktp: { type: number }
        round_decimal: { type: integer, minimum: 0, maximum: 4 }
        tp_kind: { $ref: "#/components/schemas/AssessmentComponentKind" }
    AssessmentComponentKind:
      type: string
      enum: [formative, summative, project, practical, attitude, other]
    AssessmentComponent:
      type: object
      required: [id, class_id, subject_id, term_id, code, kind, weight, sequence]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        teacher_user_id: { type: string, format: uuid }
        code: { type: string }
        kind: { $ref: "#/components/schemas/AssessmentComponentKind" }
        description: { type: string }
        kktp: { type: number }
        weight: { type: number }
        sequence: { type: integer }
    AssessmentComponentWrite:
      type: object
      required: [class_id, subject_id, code, kind, weight]
      properties:
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 32 }
        kind: { $ref: "#/components/schemas/AssessmentComponentKind" }
        description: { type: string, maxLength: 500 }
        kktp: { type: number }
        weight: { type: number, exclusiveMinimum: 0 }
        sequence: { type: integer, minimum: 1, default: 1 }
    GradebookStudent:
      type: object
      required: [student_user_id, name, scores]
      properties:
        student_user_id: { type: string, format: uuid }
        name: { type: string }
        scores:
          type: object
          additionalProperties: { type: number }
        average: { type: number }
        final_kktp: { type: number }
        report_score: { type: number }
    Gradebook:
      type: object
      required:
        [term_id, term_name, class_id, subject_id, scale, components, students, is_published]
      properties:
        term_id: { type: string, format: uuid }
        term_name: { type: string }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        scale: { $ref: "#/components/schemas/GradingScale" }
        components: { type: array, items: { $ref: "#/components/schemas/AssessmentComponent" } }
        students: { type: array, items: { $ref: "#/components/schemas/GradebookStudent" } }
        is_published: { type: boolean }
    ReportScore:
      type: object
      required: [term_id, class_id, subject_id, student_user_id, final_score]
      properties:
        term_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
