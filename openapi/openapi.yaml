      tags:
        - attendance
      operationId: saveAttendanceEntries
      x-permission: manage_attendance
      summary: Save a batch of student statuses and the lesson journal for a session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAttendanceEntriesRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The save or correction window for this session has closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/attendance/me/calendar:
    get:
      tags:
        - attendance
      operationId: getMyAttendanceCalendar
      x-permission: authenticated
      summary: The current student's daily status for one month
      parameters:
        - name: month
          in: query
          required: true
          description: YYYY-MM
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}$
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceCalendarDay"
