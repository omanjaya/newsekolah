                date:
                  type: string
                  format: date
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/attendance/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - attendance
      operationId: getAttendanceSession
      x-permission: view_attendance
      summary: One session's full recording payload
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSessionDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
