        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Conflict:
      description: The request conflicts with existing state (duplicate, dependents, or state machine)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenGone:
      description: The scan token is missing, expired, already used, or for another purpose
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleConflict:
      description: Schedule overlaps another lesson, the year is archived, or recorded attendance/substitution history
        prevents mutation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
    PageMeta:
      type: object
      required:
        - total
        - page
        - page_size
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    AcademicYear:
      type: object
      required:
        - id
        - label
        - starts_on
        - ends_on
        - is_active
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_active:
          type: boolean
        archived_at:
          type: string
          format: date-time
    AcademicYearInput:
      type: object
      required:
        - label
        - starts_on
        - ends_on
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    AcademicYearList:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcademicYear"
        page:
          $ref: "#/components/schemas/PageMeta"
    Term:
      type: object
      required:
        - id
        - academic_year_id
        - name
        - sequence
        - starts_on
        - ends_on
        - is_active
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        name:
          type: string
        sequence:
          type: integer
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_active:
          type: boolean
    TermInput:
      type: object
      required:
        - name
        - sequence
        - starts_on
        - ends_on
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        sequence:
          type: integer
          minimum: 1
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    TermUpdateInput:
      type: object
      required:
