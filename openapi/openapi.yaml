components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Conflict:
      description: The request conflicts with existing state (duplicate, dependents, or state machine)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenGone:
      description: The scan token is missing, expired, already used, or for another purpose
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleConflict:
      description: The class or the teacher already has an overlapping schedule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
    PageMeta:
      type: object
      required:
        - total
        - page
        - page_size
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    AcademicYear:
      type: object
      required:
        - id
        - label
        - starts_on
        - ends_on
        - is_active
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_active:
          type: boolean
        archived_at:
          type: string
          format: date-time
    AcademicYearInput:
      type: object
      required:
        - label
        - starts_on
        - ends_on
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    AcademicYearList:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcademicYear"
        page:
          $ref: "#/components/schemas/PageMeta"
    Term:
      type: object
      required:
        - id
        - academic_year_id
        - name
        - sequence
        - starts_on
        - ends_on
        - is_active
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        name:
          type: string
        sequence:
          type: integer
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_active:
          type: boolean
    TermInput:
      type: object
      required:
        - name
        - sequence
        - starts_on
        - ends_on
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        sequence:
          type: integer
          minimum: 1
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    TermUpdateInput:
      type: object
      required:
        - name
        - starts_on
        - ends_on
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    CalendarEventKind:
      type: string
      enum:
        - holiday
        - exam
        - event
        - no_school
        - semester_break
    CalendarEvent:
      type: object
      required:
        - id
        - academic_year_id
        - date
        - end_date
        - kind
        - name
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          description: Inclusive end of the event's date range; equals date for a single-day event.
        kind:
          $ref: "#/components/schemas/CalendarEventKind"
        name:
          type: string
        grade_level_ids:
          type: array
          description: Grade levels this event applies to; empty means school-wide.
          items:
            type: string
            format: uuid
    CalendarEventInput:
      type: object
      required:
        - date
        - end_date
        - kind
        - name
      properties:
        date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        kind:
          $ref: "#/components/schemas/CalendarEventKind"
        name:
          type: string
          minLength: 1
          maxLength: 150
        grade_level_ids:
          type: array
          items:
            type: string
            format: uuid
    CalendarEventList:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        page:
          $ref: "#/components/schemas/PageMeta"
    SchoolDay:
      type: object
      required:
        - day_of_week
        - is_active
      properties:
        day_of_week:
          type: integer
        is_active:
          type: boolean
    GradeLevelTemplate:
      type: string
      enum:
        - sd
        - smp
        - sma
        - smk
    GradeLevel:
      type: object
      required:
        - id
        - code
        - name
        - sequence
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        sequence:
          type: integer
    GradeLevelInput:
      type: object
      required:
        - code
        - name
        - sequence
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
        sequence:
          type: integer
          minimum: 1
    Track:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    TrackInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
    Class:
      type: object
      required:
        - id
        - academic_year_id
        - grade_level_id
        - name
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        grade_level_id:
          type: string
          format: uuid
        track_id:
          type: string
          format: uuid
        name:
          type: string
        room_id:
          type: string
          format: uuid
        capacity:
          type: integer
        homeroom_teacher_id:
          type: string
          format: uuid
    ClassInput:
      type: object
      required:
        - academic_year_id
        - grade_level_id
        - name
      properties:
        academic_year_id:
          type: string
          format: uuid
        grade_level_id:
          type: string
          format: uuid
        track_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        room_id:
          type: string
          format: uuid
        capacity:
          type: integer
          minimum: 0
        homeroom_teacher_id:
          type: string
          format: uuid
    ClassList:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Class"
        page:
          $ref: "#/components/schemas/PageMeta"
    EnrollmentStatus:
      type: string
      enum:
        - active
        - moved
        - graduated
        - left
    Enrollment:
      type: object
      required:
        - id
        - academic_year_id
        - student_user_id
        - class_id
        - status
        - joined_on
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EnrollmentStatus"
        joined_on:
          type: string
          format: date
        left_on:
          type: string
          format: date
    EnrollmentList:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        page:
          $ref: "#/components/schemas/PageMeta"
    AssignStudentInput:
      type: object
      required:
        - student_user_id
        - joined_on
      properties:
        student_user_id:
          type: string
          format: uuid
        joined_on:
          type: string
          format: date
    BulkAssignInput:
      type: object
      required:
        - student_user_ids
        - joined_on
      properties:
        student_user_ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
        joined_on:
          type: string
          format: date
    BulkAssignResult:
      type: object
      required:
        - assigned
        - skipped
      properties:
        assigned:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        skipped:
          type: array
