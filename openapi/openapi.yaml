      operationId: refreshToken
      x-public: true
      security: []
      summary: Rotate refresh token and mint a new access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required for mobile clients; web clients send the cookie instead.
      responses:
        "200":
          description: New tokens
          headers:
            Set-Cookie:
              description: Rotated `refresh_token` cookie for web clients
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
