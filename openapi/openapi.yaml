  parameters:
    ReportFormat:
      name: format
      in: query
      description: xlsx (default) or pdf
      schema:
        type: string
        enum:
          - xlsx
          - pdf
    ReportTitle:
      name: title
      in: query
      description: Overrides the report's default title
      schema:
        type: string
        maxLength: 200
    ReportLetterhead:
      name: letterhead
      in: query
      description: Show the tenant's letterhead (default true; has no visible effect until the tenant has configured one)
      schema:
        type: boolean
    ReportColumns:
      name: columns
      in: query
      description: Comma-separated column selection and order, each entry "key" or "key:label" (URL-encoded). Omitted or empty
        keeps every column in the report's own order.
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key (mobile clients on unstable networks) that makes a POST/PUT safe to retry;
        docs/08-security.md section 7. The same key replays the first response instead of repeating the write.
      schema:
        type: string
        maxLength: 100
    ReportFormatParam:
      name: format
      in: query
      description: Rendered file type. Defaults to xlsx.
      schema:
        type: string
        enum:
          - xlsx
          - pdf
        default: xlsx
    ReportTitleParam:
      name: title
      in: query
      description: Overrides the report's own default title.
      schema:
        type: string
        maxLength: 200
    ReportLetterheadParam:
      name: letterhead
      in: query
      description: Show the tenant's configured letterhead (kop laporan). Defaults to true.
      schema:
        type: boolean
        default: true
    ReportColumnsParam:
      name: columns
      in: query
      description: Comma-separated column selection and order, each entry either a bare column key or "key:label" to rename
        it. Omitted or empty keeps every column, in the report's own default order and labels.
      schema:
        type: string
    YearIdParam:
      name: yearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    YearIdQueryParam:
      name: academic_year_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ClassIdParam:
      name: classId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DayOfWeekParam:
      name: dayOfWeek
      in: path
      required: true
      description: ISO-8601 weekday, 1 (Monday) to 7 (Sunday)
      schema:
        type: integer
        minimum: 1
        maximum: 7
    SearchParam:
      name: search
      in: query
      schema:
        type: string
        maxLength: 150
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AnnouncementIdParam:
      name: announcementId
      in: path
      required: true
      schema:
