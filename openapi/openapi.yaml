  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key (mobile clients on unstable networks) that makes a POST/PUT safe to retry;
        docs/08-security.md section 7. The same key replays the first response instead of repeating the write.
      schema:
        type: string
        maxLength: 100
    YearIdParam:
      name: yearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    YearIdQueryParam:
      name: academic_year_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ClassIdParam:
      name: classId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DayOfWeekParam:
      name: dayOfWeek
      in: path
      required: true
      description: ISO-8601 weekday, 1 (Monday) to 7 (Sunday)
      schema:
        type: integer
        minimum: 1
        maximum: 7
    SearchParam:
      name: search
      in: query
      schema:
        type: string
        maxLength: 150
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AnnouncementIdParam:
      name: announcementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MonitorTokenHeader:
      name: X-Monitor-Token
      in: header
      required: true
      description: The tenant's configured monitor.display_token setting.
      schema:
        type: string
    TenantHeader:
      name: X-Tenant
      in: header
      required: false
      description: Tenant slug for mobile clients before a token exists. Ignored when the host already resolves a tenant or in
        single-tenant mode.
      schema:
        type: string
