        - sessions
      properties:
        generated_at:
          type: string
          format: date-time
        status_counts:
          type: object
          additionalProperties:
            type: integer
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/MonitorSessionCard"
    PresenceSnapshot:
