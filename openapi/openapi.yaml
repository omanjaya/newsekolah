  /v1/whatsapp/webhook:
    get:
      tags:
        - whatsapp
      operationId: verifyWhatsAppWebhook
      x-public: true
      security: []
      summary: Meta's webhook verification handshake (hub.challenge echo)
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge echoed back
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - whatsapp
      operationId: receiveWhatsAppWebhook
      x-public: true
      security: []
      summary: Inbound WhatsApp delivery status updates (delivered, read)
      description: |
        Meta sends this as application/json, but the body is declared here as application/octet-stream (raw
        bytes) on purpose: the signature must be verified over the exact bytes received, before any JSON
        decoding, and the generated server only hands over a raw io.Reader for a non-JSON content type.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Processed
        "401":
          description: Invalid signature
