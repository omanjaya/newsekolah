    post:
      tags:
        - academic
      operationId: commitEnrollmentImport
      x-permission: manage_enrollments
      summary: Re-parse the same workbook and apply every row that isn't an error (assign or move); the whole file is rejected
        if any row is invalid unless partial=true
      parameters:
        - $ref: "#/components/parameters/YearIdQueryParam"
        - name: move_existing
          in: query
          description: When false (default), a row for a student who already has an active enrollment elsewhere is skipped, not
            moved
          schema:
            type: boolean
            default: false
        - name: partial
          in: query
          description: When false (default), the whole file is rejected (nothing is written) if any row is an error; when true,
            invalid rows are skipped and the rest is applied
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        "200":
