          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/attendance/reports/monthly:
    get:
      tags:
        - attendance
      operationId: getMonthlyAttendanceSummary
      x-permission: view_reports
      summary: One student's daily statuses for one month
      parameters:
        - name: student_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: month
          in: query
          required: true
          description: YYYY-MM
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}$
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - totals
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceCalendarDay"
                  totals:
                    type: object
                    additionalProperties:
                      type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/monitor/snapshot:
    get:
      tags:
        - monitor
      operationId: getMonitorSnapshot
      x-public: true
      security: []
      summary: Public monitor-display snapshot, gated by the tenant's monitor.display_token setting
      parameters:
        - $ref: "#/components/parameters/MonitorTokenHeader"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/monitor/presence:
    get:
      tags:
        - monitor
      operationId: getMonitorPresence
      x-permission: view_monitor_presence
      summary: Who currently has a realtime socket open, by role
      responses:
        "200":
          description: Presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ws/monitor:
    get:
      tags:
        - monitor
      operationId: wsMonitor
      x-public: true
      security: []
      summary: Realtime monitor channel (WebSocket upgrade). Authenticated by the same monitor.display_token as GET
        /v1/monitor/snapshot, passed as a query parameter since browsers cannot set custom headers before the handshake
        completes.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ws/me:
    get:
      tags:
        - monitor
      operationId: wsMe
      x-public: true
      security: []
      summary: Realtime per-user channel (WebSocket upgrade). Authenticated by the access token, sent either as a bearer
        Authorization header (native clients) or as a `bearer.<token>` WebSocket subprotocol (browsers).
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      x-public: true
      security: []
      summary: Password login
      description: |
        Web clients (`client: web`) receive the refresh token in an httpOnly cookie scoped to `/v1/auth`
        and only the access token in the body. Mobile clients receive both tokens in the body.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              description: "`refresh_token` cookie for web clients"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      x-public: true
      security: []
      summary: Rotate refresh token and mint a new access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required for mobile clients; web clients send the cookie instead.
      responses:
        "200":
          description: New tokens
          headers:
            Set-Cookie:
              description: Rotated `refresh_token` cookie for web clients
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      x-permission: authenticated
      summary: Revoke the current session (and clear the web cookie)
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Expired `refresh_token` cookie, clearing it for web clients
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sessions:
    get:
      tags:
        - auth
      operationId: listSessions
      x-permission: authenticated
      summary: Active sessions of the current user
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sessions/{sessionId}:
    delete:
      tags:
        - auth
      operationId: revokeSession
      x-permission: authenticated
      summary: Revoke one of the current user's sessions
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me:
    get:
      tags:
        - me
      operationId: getMe
      x-permission: authenticated
      summary: Current user, roles, effective permissions, tenant
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/password:
    put:
      tags:
        - me
      operationId: changePassword
      x-permission: authenticated
      summary: Change own password; revokes other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/schedules:
    get:
      tags:
        - scheduling
      operationId: listSchedules
      x-permission: view_schedules
      summary: Grid of schedules for a class, a teacher, or one day, merged into contiguous blocks
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: class_id
          in: query
          schema:
            type: string
            format: uuid
        - name: teacher_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: day_of_week
          in: query
          description: 1 (Monday) through 7 (Sunday)
          schema:
            type: integer
            minimum: 1
            maximum: 7
      responses:
        "200":
          description: Schedule blocks
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - scheduling
      operationId: createSchedule
      x-permission: view_schedules
      summary: Create a schedule (admin for any teacher, or a teacher for themselves within the edit deadline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleWriteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
  /v1/schedules/bulk-import:
    post:
      tags:
        - scheduling
      operationId: bulkImportSchedules
      x-permission: manage_schedules
      summary: Create many schedules atomically (typically after clearing the academic year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - schedules
              properties:
                schedules:
                  type: array
                  items:
                    $ref: "#/components/schemas/ScheduleWriteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
  /v1/schedules/clear:
    post:
      tags:
        - scheduling
      operationId: clearSchedules
      x-permission: manage_schedules
      summary: Delete every schedule for one academic year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - academic_year_id
              properties:
                academic_year_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Cleared
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - scheduling
      operationId: getSchedule
      x-permission: view_schedules
      summary: One schedule
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - scheduling
      operationId: updateSchedule
      x-permission: view_schedules
      summary: Update a schedule (admin, or the owning teacher within the edit deadline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleWriteRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
    delete:
      tags:
        - scheduling
      operationId: deleteSchedule
      x-permission: view_schedules
      summary: Delete a schedule (admin, or the owning teacher within the edit deadline)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/substitutions:
    get:
      tags:
        - scheduling
      operationId: listSubstitutions
      x-permission: view_schedules
      summary: Substitution requests directed at me (incoming) or made by me (outgoing)
      parameters:
        - name: direction
          in: query
          required: true
          schema:
            type: string
            enum:
              - incoming
              - outgoing
      responses:
        "200":
          description: Substitution requests
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Substitution"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
        - scheduling
      operationId: createSubstitution
      x-permission: view_schedules
      summary: Request a substitute for one dated occurrence of my own schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubstitutionCreateRequest"
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Substitution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/substitutions/{substitutionId}/respond:
    parameters:
      - name: substitutionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - scheduling
      operationId: respondSubstitution
      x-permission: view_schedules
      summary: Accept or reject a substitution request addressed to me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accept
              properties:
                accept:
                  type: boolean
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Substitution"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/substitutions/{substitutionId}/cancel:
    parameters:
      - name: substitutionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - scheduling
      operationId: cancelSubstitution
      x-permission: view_schedules
      summary: Cancel a substitution request I made
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Substitution"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/journals:
    get:
      tags:
        - journals
      operationId: listJournals
      x-permission: authenticated
      summary: My own journals for an academic year, or (class_id given, requires view_journals_all) every journal for a class
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: class_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Journals
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Journal"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - journals
      operationId: upsertJournal
      x-permission: authenticated
      summary: Create or update the journal for a class/subject/date (unique per day)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalWriteRequest"
      responses:
        "200":
          description: Created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/journals/export:
    get:
      tags:
        - journals
      operationId: exportJournals
      x-permission: authenticated
      summary: Export journals as XLSX or DOCX
      parameters:
        - name: academic_year_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: class_id
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum:
              - xlsx
              - docx
      responses:
        "200":
          description: File
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/journals/{journalId}:
    parameters:
      - name: journalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - journals
      operationId: getJournal
      x-permission: authenticated
      summary: One journal
      responses:
        "200":
          description: Journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - journals
      operationId: deleteJournal
      x-permission: authenticated
      summary: Delete a journal (its own teacher/writer only)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /health:
    get:
      tags:
        - system
      operationId: getHealth
      x-public: true
      security: []
      summary: Liveness and dependency status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  version:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - ok
                        - fail
                        - skipped
        "503":
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/tenant/branding:
    get:
      tags:
        - tenant
      operationId: getTenantBranding
      x-public: true
      security: []
      summary: Public branding for the resolved tenant (login screen, manifest)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBranding"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/lookup:
    get:
      tags:
        - tenant
      operationId: lookupTenants
      x-public: true
      security: []
      summary: Search schools by name or slug (mobile school picker). Returns nothing in single-tenant mode except the single
        tenant.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleConflict:
      description: The class or the teacher already has an overlapping schedule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
    AttendanceStatusDef:
      type: object
      required:
        - code
        - label
        - color
        - counts_as_present
      properties:
        code:
          type: string
        label:
          type: string
        color:
          type: string
        counts_as_present:
          type: boolean
    AttendanceSessionSummary:
      type: object
      required:
        - id
        - schedule_id
        - date
        - class_id
        - subject_id
        - teacher_user_id
        - start_period_id
        - end_period_id
        - is_substitute
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        teacher_user_id:
          type: string
          format: uuid
        substitute_user_id:
          type: string
          format: uuid
        start_period_id:
          type: string
          format: uuid
        end_period_id:
          type: string
          format: uuid
        is_substitute:
          type: boolean
        submitted_at:
          type: string
          format: date-time
    AttendanceRosterItem:
      type: object
      required:
        - student_user_id
        - name
      properties:
        student_user_id:
          type: string
          format: uuid
        name:
          type: string
        previous_status:
          type: string
        current_status:
