  /v1/attendance/homeroom:
    get:
      tags:
        - attendance
      operationId: getHomeroomAttendance
      x-permission: view_attendance
      summary: One day's daily status for every student in the caller's homeroom class
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Homeroom roster with daily status
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceRosterEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/attendance/reports/daily:
    get:
      tags:
        - attendance
      operationId: getDailyAttendanceReport
      x-permission: view_reports
      summary: One class's expected vs. submitted sessions and per-student status for one day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: class_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDailyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/attendance/reports/daily/export:
    get:
      tags:
        - attendance
      operationId: exportDailyAttendanceReport
      x-permission: view_reports
      summary: The daily report as an XLSX file
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: class_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
