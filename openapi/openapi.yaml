          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        lesson_date:
          type: string
          format: date
        topic:
          type: string
        activities:
          type: string
        reflection:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JournalWriteRequest:
      type: object
      required:
        - academic_year_id
        - class_id
        - subject_id
        - lesson_date
        - topic
        - activities
      properties:
        academic_year_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        lesson_date:
          type: string
          format: date
        topic:
          type: string
          maxLength: 300
        activities:
          type: string
        reflection:
