  /v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      x-public: true
      security: []
      summary: Password login
      description: |
        Web clients (`client: web`) receive the refresh token in an httpOnly cookie scoped to `/v1/auth`
        and only the access token in the body. Mobile clients receive both tokens in the body.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              description: "`refresh_token` cookie for web clients"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
