          type: array
          items:
            $ref: "#/components/schemas/StudentSummary"
        page:
          $ref: "#/components/schemas/PageMeta"
    PromotionAction:
      type: string
      enum:
        - promote
        - retain
        - graduate
        - transfer
    PromotionOverride:
      type: object
      required:
