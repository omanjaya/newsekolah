      tags:
        - grading
      operationId: replaceGradeRanges
      x-permission: manage_grades
      summary: Replace every range of one subject-teacher scope
      description: A plain teacher (manage_grades) may only target teacher_user_id equal to themselves, or omit it to mean
        themselves; a curriculum lead or admin (manage_master_data or manage_settings) may target another teacher or
