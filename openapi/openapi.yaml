        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/leave-requests/{instanceId}/issue:
    post:
      tags:
        - permits
      operationId: issueLeaveLetter
      x-permission: issue_leave_letters
      summary: Counselor issues the numbered letter and syncs attendance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/leave-requests/{instanceId}/documents/{kind}:
    get:
      tags:
        - permits
      operationId: getLeaveDocumentUrl
      x-permission: authenticated
      summary: Short-lived signed URL for the evidence or the issued letter
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - evidence
              - letter
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                  - expires_in_seconds
                properties:
                  url:
                    type: string
                    format: uri
                  expires_in_seconds:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/documents/verify/{code}:
    get:
      tags:
        - permits
      operationId: verifyDocument
      x-public: true
      security: []
      summary: Public verification of an issued document by its printed code
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
      responses:
        "200":
          description: Document is genuine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVerification"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/documents/templates:
    get:
      tags:
        - permits
      operationId: listDocumentTemplates
      x-permission: manage_settings
      summary: Document templates of the tenant
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - permits
      operationId: createDocumentTemplate
      x-permission: manage_settings
      summary: Create a document template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/documents/templates/{templateId}:
    put:
      tags:
        - permits
      operationId: updateDocumentTemplate
      x-permission: manage_settings
      summary: Update a template body
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - body
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 150
                body:
                  type: string
                  maxLength: 200000
                variables:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/documents/templates/{templateId}/set-default:
    post:
      tags:
        - permits
      operationId: setDefaultDocumentTemplate
      x-permission: manage_settings
      summary: Make this template the default of its kind
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /health:
    get:
      tags:
        - system
      operationId: getHealth
      x-public: true
      security: []
      summary: Liveness and dependency status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  version:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - ok
                        - fail
                        - skipped
        "503":
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/tenant/branding:
    get:
      tags:
        - tenant
      operationId: getTenantBranding
      x-public: true
      security: []
      summary: Public branding for the resolved tenant (login screen, manifest)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBranding"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/lookup:
    get:
      tags:
        - tenant
      operationId: lookupTenants
      x-public: true
      security: []
      summary: Search schools by name or slug (mobile school picker). Returns nothing in single-tenant mode except the single
        tenant.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Conflict:
      description: The request conflicts with existing state (duplicate, dependents, or state machine)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenGone:
      description: The scan token is missing, expired, already used, or for another purpose
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
    ClientKind:
      type: string
      enum:
        - web
        - ios
        - android
    LoginRequest:
      type: object
      required:
        - username
        - password
        - client
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
        client:
          $ref: "#/components/schemas/ClientKind"
        device_id:
          type: string
          maxLength: 100
        device_name:
          type: string
          maxLength: 150
    AuthTokens:
      type: object
      required:
        - access_token
        - access_expires_at
        - token_type
        - user
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Present only for mobile clients.
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/Me"
    Session:
      type: object
      required:
        - id
        - client
        - created_at
        - last_seen_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: "#/components/schemas/ClientKind"
        device_name:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
    Role:
      type: object
      required:
        - id
        - slug
        - name
        - is_primary
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        is_primary:
          type: boolean
    Me:
      type: object
      required:
        - id
        - username
        - name
        - roles
        - permissions
        - tenant
        - must_change_password
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
          format: uri
        profile_kind:
          type: string
          enum:
            - student
            - teacher
            - staff
            - parent
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
          description: Effective permission codes (role plus active duty permissions).
        duties:
          type: array
          items:
            type: object
            required:
              - slug
              - scope_kind
            properties:
              slug:
                type: string
              scope_kind:
                type: string
                enum:
                  - school
                  - class
                  - student
              scope_id:
                type: string
                format: uuid
              scope_label:
                type: string
        active_academic_year:
          type: object
          description: Omitted when the tenant has no active academic year.
          required:
            - id
            - label
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
        tenant:
          $ref: "#/components/schemas/TenantBranding"
        must_change_password:
          type: boolean
        impersonated_by:
          type: object
          description: Present only during an impersonation session.
          properties:
            user_id:
              type: string
              format: uuid
            name:
              type: string
    ScanPurpose:
      type: string
      enum:
        - classroom_entry
        - late_arrival
        - approve_stage
        - gate_exit
        - library_visit
        - library_self_service
        - library_opname
        - kiosk
    WorkflowKind:
      type: string
      enum:
        - exit_permit
        - late_arrival
        - leave_request
    WorkflowStatus:
      type: string
      enum:
        - in_progress
        - approved
        - rejected
        - completed
        - cancelled
        - expired
    LeaveCategory:
      type: string
      enum:
        - religious_ceremony
        - sick
        - dispensation
        - other
    RequiredAction:
      type: string
      enum:
        - none
        - call_parent
        - send_home
    ScanRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 128
    IssuedScanToken:
      type: object
      required:
        - token
        - purpose
        - expires_at
        - expires_in_seconds
      properties:
        token:
          type: string
        purpose:
          $ref: "#/components/schemas/ScanPurpose"
        context_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        expires_in_seconds:
          type: integer
    WorkflowStage:
      type: object
      required:
        - key
        - label
        - approver_rule
        - verification
      properties:
        key:
          type: string
          pattern: ^[a-z0-9_]{2,40}$
        label:
          type: string
          maxLength: 80
        approver_rule:
          type: string
          description: any_teacher, teacher_of_class_now, homeroom_of_student, or duty:<slug>
        verification:
          type: string
          enum:
            - qr_scan
            - manual
            - auto
        distinct_from:
          type: array
          items:
            type: string
        lookahead_slots:
          type: integer
          minimum: 0
          maximum: 10
    WorkflowDefinition:
      type: object
      required:
        - id
        - kind
        - version
        - is_active
        - stages
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WorkflowKind"
        version:
          type: integer
        is_active:
          type: boolean
        stages:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStage"
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    WorkflowEvent:
      type: object
      required:
        - id
        - to_status
        - verification
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        stage_key:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        actor_user_id:
          type: string
          format: uuid
        verification:
          type: string
        note:
          type: string
        occurred_at:
          type: string
          format: date-time
    WorkflowInstance:
      type: object
      required:
        - id
        - kind
        - status
        - current_stage_index
        - subject_user_id
        - opened_at
        - stages
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/WorkflowKind"
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        current_stage_index:
          type: integer
        current_stage:
          $ref: "#/components/schemas/WorkflowStage"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStage"
        subject_user_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowEvent"
    ExitPermitDetail:
      type: object
      required:
        - instance
        - destination
        - start_period_id
        - end_period_id
        - student_name
        - class_name
      properties:
        instance:
          $ref: "#/components/schemas/WorkflowInstance"
        destination:
          type: string
        start_period_id:
          type: string
          format: uuid
        end_period_id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        exited_at:
          type: string
          format: date-time
        student_name:
          type: string
        class_name:
          type: string
    LateArrivalDetail:
      type: object
      required:
        - instance
        - reason
        - occurrence_number
        - required_action
        - homeroom_reported
      properties:
        instance:
          $ref: "#/components/schemas/WorkflowInstance"
        reason:
          type: string
        occurrence_number:
          type: integer
        required_action:
          $ref: "#/components/schemas/RequiredAction"
        homeroom_reported:
          type: boolean
        completed_at:
          type: string
          format: date-time
    LateArrivalSummary:
      type: object
      required:
        - instance_id
        - student_user_id
        - status
        - current_stage_index
        - reason
        - occurrence_number
        - required_action
        - opened_at
      properties:
        instance_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        current_stage_index:
          type: integer
        reason:
          type: string
        occurrence_number:
          type: integer
        required_action:
          $ref: "#/components/schemas/RequiredAction"
        homeroom_reported:
          type: boolean
        opened_at:
          type: string
          format: date-time
    LeaveRequestDetail:
      type: object
      required:
        - instance
        - category
        - reason
        - starts_on
        - ends_on
        - student_name
        - class_name
        - has_evidence
        - has_letter
      properties:
        instance:
          $ref: "#/components/schemas/WorkflowInstance"
        category:
          $ref: "#/components/schemas/LeaveCategory"
        reason:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        letter_number:
          type: string
        issued_at:
          type: string
          format: date-time
        student_name:
          type: string
        class_name:
          type: string
        guardian_name:
          type: string
        has_evidence:
          type: boolean
        has_letter:
          type: boolean
    LeaveRequestSummary:
      type: object
      required:
        - instance_id
        - student_user_id
        - status
        - current_stage_index
        - category
        - starts_on
        - ends_on
        - student_name
        - class_name
        - opened_at
      properties:
        instance_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        current_stage_index:
          type: integer
        category:
          $ref: "#/components/schemas/LeaveCategory"
        reason:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        letter_number:
          type: string
        student_name:
          type: string
        class_name:
          type: string
        opened_at:
          type: string
          format: date-time
    DocumentVerification:
      type: object
      required:
        - number
        - kind
        - issued_at
        - revoked
      properties:
        number:
          type: string
        kind:
          type: string
        issued_at:
          type: string
          format: date-time
        student_name:
          type: string
        class_name:
          type: string
        valid_from:
          type: string
          format: date
        valid_until:
          type: string
          format: date
        revoked:
          type: boolean
    DocumentTemplateWrite:
      type: object
      required:
        - kind
        - name
        - body
      properties:
        kind:
          type: string
          enum:
            - leave_letter
            - warning_letter
            - class_journal
            - member_card
            - item_label
            - clearance_letter
            - report
        name:
          type: string
          minLength: 1
          maxLength: 150
        engine:
          type: string
          enum:
            - html
          default: html
        body:
          type: string
          maxLength: 200000
        variables:
          type: array
          items:
            type: string
        is_default:
          type: boolean
          default: false
    DocumentTemplate:
      type: object
      required:
        - id
        - kind
        - name
        - engine
        - body
        - is_default
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        engine:
          type: string
        body:
          type: string
        variables:
          type: array
          items:
            type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
    TenantBranding:
      type: object
      required:
        - tenant_id
        - slug
        - name
        - accent_color
        - locale
        - timezone
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        short_name:
          type: string
        product_name:
          type: string
          description: Platform-wide product name (interim "SION"); use as app title fallback.
        tagline:
          type: string
        logo_url:
          type: string
          format: uri
        favicon_url:
          type: string
          format: uri
        accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        locale:
          type: string
          enum:
            - id
            - en
        timezone:
          type: string
  parameters:
    TenantHeader:
      name: X-Tenant
      in: header
      required: false
      description: Tenant slug for mobile clients before a token exists. Ignored when the host already resolves a tenant or in
        single-tenant mode.
      schema:
        type: string
