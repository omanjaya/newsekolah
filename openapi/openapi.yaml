          format: uuid
        class_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        teacher_user_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
        start_period_id:
          type: string
          format: uuid
        end_period_id:
          type: string
          format: uuid
        source:
