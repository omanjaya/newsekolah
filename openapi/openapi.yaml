      description: >
        format/title/letterhead/columns customise the downloaded file (see docs/05-shared-components.md, "Laporan dan
        ekspor"); every report kind accepts them. grade_level_id is an additional scope every class-scoped kind accepts
        in place of class_id, to export one section per class in the grade level; the two are mutually exclusive.
      parameters:
        - name: reportKind
          in: path
          required: true
          schema:
            type: string
        - name: class_id
          in: query
          schema:
            type: string
            format: uuid
        - name: grade_level_id
          in: query
          description: Every class of this grade level, one section per class; mutually exclusive with class_id
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: term_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: format
          in: query
          schema:
            type: string
            enum:
              - xlsx
              - pdf
            default: xlsx
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: letterhead
          in: query
          schema:
            type: boolean
            default: true
