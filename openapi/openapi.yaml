          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      x-public: true
      security: []
      summary: Password login
      description: |
        Web clients (`client: web`) receive the refresh token in an httpOnly cookie scoped to `/v1/auth`
        and only the access token in the body. Mobile clients receive both tokens in the body.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              description: "`refresh_token` cookie for web clients"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      x-public: true
      security: []
      summary: Rotate refresh token and mint a new access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required for mobile clients; web clients send the cookie instead.
      responses:
        "200":
          description: New tokens
          headers:
            Set-Cookie:
              description: Rotated `refresh_token` cookie for web clients
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      x-permission: authenticated
      summary: Revoke the current session (and clear the web cookie)
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Expired `refresh_token` cookie, clearing it for web clients
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sessions:
    get:
      tags:
        - auth
      operationId: listSessions
      x-permission: authenticated
      summary: Active sessions of the current user
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sessions/{sessionId}:
    delete:
      tags:
        - auth
      operationId: revokeSession
      x-permission: authenticated
      summary: Revoke one of the current user's sessions
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me:
    get:
      tags:
        - me
      operationId: getMe
      x-permission: authenticated
      summary: Current user, roles, effective permissions, tenant
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/password:
    put:
      tags:
        - me
      operationId: changePassword
      x-permission: authenticated
      summary: Change own password; revokes other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      tags:
        - system
      operationId: getHealth
      x-public: true
      security: []
      summary: Liveness and dependency status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  version:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - ok
                        - fail
                        - skipped
        "503":
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/tenant/branding:
    get:
      tags:
        - tenant
      operationId: getTenantBranding
      x-public: true
      security: []
      summary: Public branding for the resolved tenant (login screen, manifest)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBranding"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/lookup:
    get:
      tags:
        - tenant
      operationId: lookupTenants
      x-public: true
      security: []
      summary: Search schools by name or slug (mobile school picker). Returns nothing in single-tenant mode except the single
        tenant.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Conflict:
      description: The request conflicts with existing state (duplicate, dependents, or state machine)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or revoked credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code, SCREAMING_SNAKE_CASE (e.g. AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED,
                TENANT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, NOT_FOUND).
            message:
              type: string
              description: Human-readable, localized by Accept-Language (default id).
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            request_id:
              type: string
    UserStatus:
      type: string
      enum:
        - active
        - inactive
        - invited
    ProfileKind:
      type: string
      enum:
        - student
        - teacher
        - staff
        - parent
    DutyScopeKind:
      type: string
      enum:
        - school
        - class
        - student
    UserProfileFields:
      type: object
      description: Optional profile columns; which ones apply depends on profile_kind.
      properties:
        nik:
          type: string
          maxLength: 16
        gender:
          type: string
          enum:
            - L
            - P
            - ""
        birth_place:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        religion:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 500
        district:
          type: string
          maxLength: 80
        city:
          type: string
          maxLength: 80
        blood_type:
          type: string
          maxLength: 3
        nis:
          type: string
          maxLength: 30
        nisn:
          type: string
          maxLength: 30
        entry_year:
          type: integer
        previous_school:
          type: string
          maxLength: 150
        father_name:
          type: string
          maxLength: 150
        mother_name:
          type: string
          maxLength: 150
        guardian_name:
          type: string
          maxLength: 150
        guardian_phone:
          type: string
          maxLength: 30
        parent_occupation:
          type: string
          maxLength: 100
        nip:
          type: string
          maxLength: 40
        nuptk:
          type: string
          maxLength: 40
        employment_status:
          type: string
          maxLength: 30
        last_education:
          type: string
          maxLength: 100
        joined_year:
          type: integer
        specialization:
          type: string
          maxLength: 150
        employee_number:
          type: string
          maxLength: 40
        position:
          type: string
          maxLength: 100
    RoleGrant:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: string
          format: uuid
        is_primary:
          type: boolean
          default: false
    UserWriteFields:
      type: object
      required:
        - name
        - profile_kind
        - roles
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        locale:
          type: string
          enum:
            - id
            - en
        profile_kind:
          $ref: "#/components/schemas/ProfileKind"
        profile:
          $ref: "#/components/schemas/UserProfileFields"
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoleGrant"
    CreateUserRequest:
      allOf:
        - $ref: "#/components/schemas/UserWriteFields"
        - type: object
          properties:
            username:
              type: string
              maxLength: 80
              description: Generated from the name when omitted.
            password:
              type: string
              minLength: 8
              maxLength: 128
              description: When omitted a random initial password is set and the user must change it via a set-password token.
    UpdateUserRequest:
      $ref: "#/components/schemas/UserWriteFields"
    AdminUser:
      type: object
      required:
        - id
        - username
        - name
        - status
        - profile_kind
        - roles
        - must_change_password
        - created_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        profile_kind:
          $ref: "#/components/schemas/ProfileKind"
        locale:
          type: string
        avatar_url:
          type: string
          format: uri
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        profile:
          $ref: "#/components/schemas/UserProfileFields"
    PermissionCodes:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    RoleWrite:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9_]{2,50}$
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 500
    AdminRole:
      type: object
      required:
        - id
        - slug
        - name
        - is_system
        - permissions
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        user_count:
          type: integer
    DutyTypeWrite:
      type: object
      required:
        - slug
        - name
        - scope_kind
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9_]{2,50}$
        name:
          type: string
          minLength: 1
          maxLength: 150
        scope_kind:
          $ref: "#/components/schemas/DutyScopeKind"
    DutyType:
      type: object
      required:
        - id
        - slug
        - name
        - scope_kind
        - is_active
        - permissions
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        scope_kind:
          $ref: "#/components/schemas/DutyScopeKind"
        is_active:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    DutyAssignmentWrite:
      type: object
      required:
        - academic_year_id
        - duty_type_id
        - user_id
      properties:
        academic_year_id:
          type: string
          format: uuid
        duty_type_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        scope_class_id:
          type: string
          format: uuid
        scope_student_id:
          type: string
          format: uuid
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    DutyAssignment:
      type: object
      required:
        - id
        - academic_year_id
        - duty_type_id
        - duty_slug
        - duty_name
        - user_id
        - is_active
        - starts_on
      properties:
        id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        duty_type_id:
          type: string
          format: uuid
        duty_slug:
          type: string
        duty_name:
          type: string
        user_id:
          type: string
          format: uuid
        scope_class_id:
          type: string
          format: uuid
        scope_student_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
    AuditLogEntry:
      type: object
      required:
        - id
        - action
        - entity_type
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        acting_as_user_id:
          type: string
          format: uuid
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        ip:
          type: string
        user_agent:
          type: string
        request_id:
          type: string
        occurred_at:
          type: string
          format: date-time
    ClientKind:
      type: string
      enum:
        - web
        - ios
        - android
    LoginRequest:
      type: object
      required:
        - username
        - password
        - client
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
        client:
          $ref: "#/components/schemas/ClientKind"
        device_id:
          type: string
          maxLength: 100
        device_name:
          type: string
          maxLength: 150
    AuthTokens:
      type: object
      required:
        - access_token
        - access_expires_at
        - token_type
        - user
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Present only for mobile clients.
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/Me"
    Session:
      type: object
      required:
        - id
        - client
        - created_at
        - last_seen_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: "#/components/schemas/ClientKind"
        device_name:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
    Role:
      type: object
      required:
        - id
        - slug
        - name
        - is_primary
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        is_primary:
          type: boolean
    Me:
      type: object
      required:
        - id
        - username
        - name
        - roles
        - permissions
        - tenant
        - must_change_password
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
          format: uri
        profile_kind:
          type: string
          enum:
            - student
            - teacher
            - staff
            - parent
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
          description: Effective permission codes (role plus active duty permissions).
        duties:
          type: array
          items:
            type: object
            required:
              - slug
              - scope_kind
            properties:
              slug:
                type: string
              scope_kind:
                type: string
                enum:
                  - school
                  - class
                  - student
              scope_id:
                type: string
                format: uuid
              scope_label:
                type: string
        active_academic_year:
          type: object
          description: Omitted when the tenant has no active academic year.
          required:
            - id
            - label
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
        tenant:
          $ref: "#/components/schemas/TenantBranding"
        must_change_password:
          type: boolean
        impersonated_by:
          type: object
          description: Present only during an impersonation session.
          properties:
            user_id:
              type: string
              format: uuid
            name:
              type: string
    TenantSummary:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
    TenantBranding:
      type: object
      required:
        - tenant_id
        - slug
        - name
        - accent_color
        - locale
        - timezone
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        short_name:
          type: string
        product_name:
          type: string
          description: Platform-wide product name (interim "SION"); use as app title fallback.
        tagline:
          type: string
        logo_url:
          type: string
          format: uri
        favicon_url:
          type: string
          format: uri
        accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        locale:
          type: string
          enum:
            - id
            - en
        timezone:
          type: string
  parameters:
    TenantHeader:
      name: X-Tenant
      in: header
      required: false
      description: Tenant slug for mobile clients before a token exists. Ignored when the host already resolves a tenant or in
        single-tenant mode.
      schema:
        type: string
