openapi: 3.1.0
info:
  title: newsekolah API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://github.com/omanjaya/newsekolah
  description: |
    Contract-first API for the school platform. Every operation declares `x-permission`
    (a permission code) or `x-public: true`. Errors always use the Error schema with a stable `code`.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://{host}
    description: Deployed instance (tenant host)
    variables:
      host:
        default: sion.sch.id
security:
  - bearerAuth: []
tags:
  - name: system
    description: Liveness and metadata
  - name: auth
    description: Login, token refresh, sessions
  - name: me
    description: Current user
  - name: tenant
    description: School (tenant) discovery and branding
  - name: scheduling
    description: Teaching schedules and substitutions
  - name: journals
    description: Class journals
  - name: attendance
    description: Teacher-recorded attendance, student calendar, reports
  - name: monitor
    description: Public display and realtime channels
  - name: academic
    description: Academic years, terms, calendar, grade structure, classes, enrollments, subjects, periods, teaching assignments
  - name: users
    description: User administration
  - name: roles
    description: Roles, permissions
  - name: duties
    description: Duty types and assignments
  - name: audit
    description: Audit log
  - name: permits
    description: Scan tokens, exit permits, late arrivals, leave requests, documents
  - name: discipline
    description: Violations, warning letters, counseling
  - name: grading
    description: Assessment components, grades, report scores, stars
  - name: reports
    description: Report centre and exports
  - name: family
    description: Parent view of a linked child
  - name: platform
    description: Cross-tenant platform console (multi-tenant deployments only)
  - name: library
    description: Catalogue, circulation, reservations, stocktake, and the public OPAC
  - name: integrations
    description: API keys and outgoing webhooks for machine access to the API
  - name: analytics
    description: Early-warning risk signals per student
  - name: activities
    description: Extracurricular clubs and membership, meeting attendance, school activities, and student achievements
  - name: mentoring
    description: Guru wali mentor groups, meeting notes, per-student view, and term summaries
  - name: supervision
    description: Leadership observing a teacher's lesson against a scored instrument
  - name: staff-attendance
    description: Working attendance of teachers and staff -- schedules, daily records, corrections, monthly recap
  - name: visitors
    description: Guests at the gate (expected list, board, sign-in/out, badge) and campus incidents
  - name: billing
    description: Fee types, discounts, bill generation, payments, receipts and arrears
