# Air rebuilds and restarts cmd/api on every Go, SQL or template change.
# Used only by infra/docker/docker-compose.dev.yml.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql", "yaml", "yml", "tmpl", "html"]
  exclude_dir = ["tmp", "testdata", "internal/gen"]
  # internal/gen is regenerated by sqlc and oapi-codegen; watching it would
  # restart the server mid-generation, so it is excluded and a regenerate
  # still triggers a rebuild through the files that import it.
  exclude_regex = ["_test\\.go$"]
  delay = 300
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[misc]
  clean_on_exit = true
