version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "internal/modules/identity/queries"
      - "internal/modules/school/queries"
      - "internal/modules/notifications/queries"
      - "internal/modules/announcements/queries"
      - "internal/modules/scheduling/queries"
      - "internal/modules/attendance/queries"
      - "internal/modules/academic/queries"
      - "internal/modules/permits/queries"
      - "internal/modules/discipline/queries"
      - "internal/modules/library/queries"
      - "internal/modules/grading/queries"
      - "internal/modules/reports/queries"
      - "internal/modules/platform/queries"
      - "internal/modules/integrations/queries"
      - "internal/modules/analytics/queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/gen/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
