# Single-school self-host stack. See infra/README.md for install and operation.
#
# Secrets: every variable below can be provided directly via .env, or as a
# Docker/Swarm file secret by setting the `_FILE` variant instead (for example
# JWT_SIGNING_KEY_FILE=/run/secrets/jwt_signing_key). Postgres and MinIO honor
# `_FILE` natively; apps/api reads `_FILE` for its own settings per
# docs/08-security.md section 8. Never set a bare secret value in this file.
name: newsekolah

x-api-image: &api-image
  build:
    context: ../../apps/api
    dockerfile: Dockerfile
  image: ${API_IMAGE:-newsekolah-api:local}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsekolah}
      POSTGRES_USER: ${POSTGRES_USER:-newsekolah}
    # Sane defaults for a 2 vCPU / 4 GB VPS (docs/09-tech-stack.md section 5);
    # override via the matching env vars for bigger hardware.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only containers on this compose network reach Postgres.
    expose:
      - "5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsekolah} -d ${POSTGRES_DB:-newsekolah}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # No published port: Redis is reached only from api/worker on this network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY}}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # No published port: object storage is reached only from api/worker/backup
    # and, for the console, via an operator SSH tunnel — never the public internet.
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-$S3_ACCESS_KEY}" "${MINIO_ROOT_PASSWORD:-$S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/${S3_BUCKET:-newsekolah}" &&
        mc anonymous set none "local/${S3_BUCKET:-newsekolah}"
    restart: "no"

  migrate:
    <<: *api-image
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["/migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      TENANCY_MODE: ${TENANCY_MODE:-single}
      # Connect as the least-privilege app_rw role, never as POSTGRES_USER
      # (the initdb superuser DATABASE_URL above points migrate at): a
      # superuser always bypasses row level security, so RLS would never
      # actually apply. The migrate service rotates app_rw's password to
      # APP_DB_PASSWORD via ALTER ROLE on every run (see
      # apps/api/migrations/0004_db_roles.up.sql), and api itself refuses to
      # start in production if it ever finds itself connected as a
      # superuser or BYPASSRLS role anyway.
      DATABASE_URL: postgresql://app_rw:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-newsekolah}?sslmode=disable
      # Absolute URL presigned URLs are signed against instead of
      # S3_ENDPOINT, for a browser to actually be able to reach them (e.g.
      # behind a shared system Caddy that never publishes MinIO's port
      # publicly -- infra/README.md "Shared system Caddy (VPS)"). Empty by
      # default: the bundled Caddy setup needs no public MinIO endpoint,
      # since it terminates TLS and could in principle route to MinIO
      # itself, but nothing in this stack does that today, so uploads on
      # the bundled setup remain server-mediated only where a module
      # supports it.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      # Avoids a GetBucketLocation network round trip when presigning (see
      # apps/api/internal/platform/storage.DefaultRegion); "us-east-1" also
      # matches what EnsureBucket creates by default.
      S3_REGION: ${S3_REGION:-us-east-1}
    command: ["/api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    # The api binary runs a distroless final stage (no shell/curl/wget), so the
    # healthcheck needs the binary itself to expose a self-check subcommand:
    # `/api --healthcheck` should perform a local GET /health and exit 0/1.
    # Coordinate this with apps/api; see infra/README.md "known gaps".
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *api-image
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      TENANCY_MODE: ${TENANCY_MODE:-single}
      # See the api service above: connect as app_rw, not the migrate
      # service's superuser DATABASE_URL.
      DATABASE_URL: postgresql://app_rw:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-newsekolah}?sslmode=disable
      # See the api service above: presigned URLs the worker issues (e.g.
      # rendered documents) need the same public endpoint and region.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    command: ["/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    # The web image is a pnpm workspace build: the context must be the monorepo
    # root so the Dockerfile can copy packages/ and the workspace manifests.
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Baked into the client bundle at build time like every
        # NEXT_PUBLIC_* var; must match VAPID_PUBLIC_KEY the api reads.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        # Reuses the api's S3_PUBLIC_ENDPOINT value (see the api service
        # above) so middleware.ts's CSP can allow it in connect-src. A
        # same-origin deployment (the common VPS case: S3_PUBLIC_ENDPOINT
        # is this site's own domain) is already covered by "connect-src
        # 'self'" and does not strictly need this, but passing it through
        # unconditionally means a future deployment where the two origins
        # differ works without an extra wiring step.
        NEXT_PUBLIC_S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ENDPOINT:-}
    image: ${WEB_IMAGE:-newsekolah-web:local}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # See the build arg above: middleware.ts reads this at request time
      # (self-hosted Next.js runs the middleware in the same Node process
      # as the rest of the app, not a separate edge deployment), so it is
      # passed at runtime too, not only baked in at build.
      NEXT_PUBLIC_S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ENDPOINT:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  # Optional daily backup sidecar: pg_dump + MinIO mirror to an S3 target,
  # the Postgres dump always encrypted with age (BACKUP_AGE_RECIPIENT is
  # required; infra/scripts/backup.sh refuses to run without it). Enable
  # with `docker compose --profile backup up -d`. See infra/scripts/backup.sh.
  backup:
    build:
      context: ../..
      dockerfile: infra/docker/backup/Dockerfile
    image: ${BACKUP_IMAGE:-newsekolah-backup:local}
    restart: unless-stopped
    profiles: ["backup"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backup_work:/work

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  backup_work:
